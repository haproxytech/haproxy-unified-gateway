apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp-backend-crd-gateway
spec:
  gatewayClassName: haproxy
  listeners:
    - name: tcp
      port: 31448
      protocol: TCP
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
