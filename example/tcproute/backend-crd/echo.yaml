kind: Deployment
apiVersion: apps/v1
metadata:
  name: tcp-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-echo
  template:
    metadata:
      labels:
        app: tcp-echo
    spec:
      containers:
        - name: http-echo
          image: "haproxytech/http-echo:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: tcp-echo
  annotations:
    gate.v3.haproxy.org/cr-backend: backend-tcp-tuning
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
  selector:
    app: tcp-echo
