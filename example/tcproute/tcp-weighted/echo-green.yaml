kind: Deployment
apiVersion: apps/v1
metadata:
  name: tcp-green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-green
  template:
    metadata:
      labels:
        app: tcp-green
    spec:
      containers:
        - name: http-echo
          image: "haproxytech/http-echo:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: tcp-green
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
  selector:
    app: tcp-green
