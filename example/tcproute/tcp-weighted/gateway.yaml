apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp-weighted-gateway
spec:
  gatewayClassName: haproxy
  listeners:
    - name: tcp
      port: 31447
      protocol: TCP
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
