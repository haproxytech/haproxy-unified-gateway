apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-hello-world-listenerset
  namespace: listenerset-app
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: app-listeners
    sectionName: http
  hostnames:
  - listenerset.haproxy.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hello-world-listenerset
      port: 80
