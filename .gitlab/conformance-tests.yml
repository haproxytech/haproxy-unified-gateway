# The conformance jobs run the suite unskipped, so a report published for a
# release covers every test that run executes. A one-off run can narrow it with
# HUG_CONFORMANCE_SKIP_TESTS, a different name from the job-level variable on
# purpose, so GitLab precedence cannot shadow the override.

conformance-GW-API-1_6_3:
  allow_failure: true
  stage: conformance-tests
  retry: 0
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == 'nightly'
    - if: "$CI_PROJECT_NAMESPACE != 'haproxy-controller/community' && $CI_PIPELINE_SOURCE == 'push'"
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-go$GO_VERSION
  services:
    - name: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-dind
      alias: docker
  tags:
    - go
  variables:
    # Runner kernels lack ip6table_raw; docker 29 needs it for IPv6 endpoints.
    DOCKER_INSECURE_NO_IPTABLES_RAW: "1"
    GWAPI_VERSION: "1.6.3"
    CLUSTER_NAME: "conformance-1-6-3"
    CONFORMANCE_REPORT_OUTPUT: "${CI_PROJECT_DIR}/conformance-report-${GWAPI_VERSION}.yaml"
    CONFORMANCE_JUNIT_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}.xml"
    CONFORMANCE_JUNIT_HTML_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}.html"
    HUG_SERVICE_TYPE: "ClusterIP"
  before_script:
    - export PATH=$PATH:/root/go/bin
    - docker login -u='$app' -p "$CI_REGISTRY_TOKEN" registry.haproxy.com
    - docker pull -q $HAPROXY_REGISTRY_GO/alpine:3
    - docker image tag $HAPROXY_REGISTRY_GO/alpine:3 alpine:3
    - docker pull -q $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine
    - docker image tag $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine golang:$GO_VERSION-alpine
    - sed -i "s~FROM golang~FROM $HAPROXY_REGISTRY_GO/golang~g" "build/Dockerfile"
    - sed -i "s~FROM haproxytech/haproxy-alpine~FROM $HAPROXY_REGISTRY_GO/haproxy-alpine~g" "build/Dockerfile"
    - docker build -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
  script:
    - task conformance-create-ci
    - task conformance-build-test-image
    - task conformance-run-job
  after_script:
    - task kind-delete
  artifacts:
    when: always
    paths:
      - conformance-report-${GWAPI_VERSION}.yaml
      - conformance-junit-${GWAPI_VERSION}.xml
      - conformance-junit-${GWAPI_VERSION}.html
    reports:
      junit: conformance-junit-${GWAPI_VERSION}.xml

conformance-MR-GW-API-1_6_3:
  allow_failure: false
  stage: conformance
  retry: 0
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push'
  image: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-go$GO_VERSION
  services:
    - name: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-dind
      alias: docker
  tags:
    - go
  variables:
    # Runner kernels lack ip6table_raw; docker 29 needs it for IPv6 endpoints.
    DOCKER_INSECURE_NO_IPTABLES_RAW: "1"
    GWAPI_VERSION: "1.6.3"
    CLUSTER_NAME: "conformance-mr-1-6-3"
    CONFORMANCE_REPORT_OUTPUT: "${CI_PROJECT_DIR}/conformance-report-${GWAPI_VERSION}.yaml"
    CONFORMANCE_JUNIT_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}.xml"
    CONFORMANCE_JUNIT_HTML_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}.html"
    CONFORMANCE_RUN_TEST: ""
    HUG_SERVICE_TYPE: "ClusterIP"
    # Pod label selector for conformance-collect-debug-mr.
    # When set, that task collects logs, haproxy.cfg and map files from the
    # matching HUG pod after the conformance run. The deployer intentionally
    # does NOT delete the pod when its gateway is removed, keeping it alive
    # so artifacts can be retrieved here before the cluster is torn down.
    # Leave empty (default) to skip collection entirely.
    # Example: "run=hug-4ff08ccae6d535c8"  (sha derived from gateway ns/name)
    HUG_LABEL_COLLECT_LOGS: ""
  before_script:
    - export PATH=$PATH:/root/go/bin
    - docker login -u='$app' -p "$CI_REGISTRY_TOKEN" registry.haproxy.com
    - docker pull -q $HAPROXY_REGISTRY_GO/alpine:3
    - docker image tag $HAPROXY_REGISTRY_GO/alpine:3 alpine:3
    - docker pull -q $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine
    - docker image tag $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine golang:$GO_VERSION-alpine
    - sed -i "s~FROM golang~FROM $HAPROXY_REGISTRY_GO/golang~g" "build/Dockerfile"
    - sed -i "s~FROM haproxytech/haproxy-alpine~FROM $HAPROXY_REGISTRY_GO/haproxy-alpine~g" "build/Dockerfile"
    - docker build -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
  script:
    - task conformance-create-ci
    - task conformance-build-test-image
    # Controller had ~2 min since deploy; dump its state before the suite scales it down.
    - task conformance-dump-controller-debug || true
    - task conformance-run-job
  after_script:
    - task conformance-dump-controller-debug STAGE=post-run || true
    - task conformance-collect-debug-mr || true
    - task kind-delete
  artifacts:
    when: always
    paths:
      - conformance-report-${GWAPI_VERSION}.yaml
      - conformance-junit-${GWAPI_VERSION}.xml
      - conformance-junit-${GWAPI_VERSION}.html
      - debug-hug/
    reports:
      junit: conformance-junit-${GWAPI_VERSION}.xml

# Publish a conformance report for a release, producing the files an upstream
# kubernetes-sigs/gateway-api MR adds. One job, one input: the version.
#
#   - Tag pipelines run it automatically, with the version taken from the tag.
#   - A manual pipeline run serves an already-released version: set
#     HUG_IMPLEMENTATION_VERSION to e.g. v1.0.7.
#
# The version and the skip list are deliberately not given defaults here. The
# version must come from the tag rule below or from whoever runs the pipeline;
# the skip-list default lives in taskfile/conformance.yml and is passed
# explicitly to each task, so a value supplied to the pipeline is used as-is.
#
# This job does NOT build the controller image: it pulls
# haproxytech/haproxy-unified-gateway:<tag-without-v> from Docker Hub, so the
# bits under test are the published release artifact. On a tag pipeline that
# creates an ordering dependency on .github/workflows/docker_auto_release.yml
# having pushed that tag. With retry: 0 a pull that loses that race fails the
# job loudly; re-run it once the image is published.
conformance-publish:
  allow_failure: false
  stage: conformance
  retry: 0
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      variables:
        HUG_IMPLEMENTATION_VERSION: $CI_COMMIT_TAG
    # Compared against a shape, not against emptiness. An undefined variable
    # substitutes to the empty string, and a project variable whose value is
    # itself a reference (e.g. $CI_COMMIT_TAG) is non-empty at pipeline creation
    # but expands to empty inside the job - which includes the job and then fails
    # its own guard. Requiring a tag shape can do neither, and rejects "1.0.7"
    # (the report carries the leading v; only the image tag strips it).
    - if: $HUG_IMPLEMENTATION_VERSION =~ /^v[0-9]+\.[0-9]+/
  image: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-go$GO_VERSION
  services:
    - name: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-dind
      alias: docker
  tags:
    - go
  variables:
    # Runner kernels lack ip6table_raw; docker 29 needs it for IPv6 endpoints.
    DOCKER_INSECURE_NO_IPTABLES_RAW: "1"
    GWAPI_VERSION: "1.6.3"
    CLUSTER_NAME: "conformance-publish"
    # The suite runs unskipped. To narrow one run, set
    # HUG_CONFORMANCE_SKIP_TESTS at pipeline-run time: a different name, so
    # nothing declared here can shadow it.
    CONFORMANCE_REPORT_OUTPUT: "${CI_PROJECT_DIR}/conformance-report-${GWAPI_VERSION}.yaml"
    CONFORMANCE_JUNIT_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}.xml"
    CONFORMANCE_JUNIT_HTML_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}.html"
    HUG_SERVICE_TYPE: "ClusterIP"
  before_script:
    - export PATH=$PATH:/root/go/bin
    - docker login -u='$app' -p "$CI_REGISTRY_TOKEN" registry.haproxy.com
    - docker pull -q $HAPROXY_REGISTRY_GO/alpine:3
    - docker image tag $HAPROXY_REGISTRY_GO/alpine:3 alpine:3
    - docker pull -q $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine
    - docker image tag $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine golang:$GO_VERSION-alpine
    - sed -i "s~FROM golang~FROM $HAPROXY_REGISTRY_GO/golang~g" "build/Dockerfile"
    - sed -i "s~FROM haproxytech/haproxy-alpine~FROM $HAPROXY_REGISTRY_GO/haproxy-alpine~g" "build/Dockerfile"
  script:
    - task conformance-publish-ci
    # Consumes the publish/ artifacts the line above just produced, and pushes the
    # payload as a commit to a dev-v<major.minor> branch on the haproxyci/gateway-api
    # fork (dev-v1.0 for HUG_IMPLEMENTATION_VERSION=v1.0.7), not its main. It needs
    # the deploy key in HAPROXY_CI_GWAPI_PRIVATE_KEY (a masked CI variable holding
    # the path to the key, which the job chmods and ssh-adds). Set
    # HUG_GITHUB_DRY_RUN=1 at pipeline-run time to rehearse up to the commit and
    # not push.
    - task conformance-publish-github
  after_script:
    - task kind-delete
  artifacts:
    when: always
    paths:
      - publish/
      - conformance-report-${GWAPI_VERSION}.yaml
