conformance-GW-API-1_5_0:
  allow_failure: true
  stage: conformance-tests
  retry: 0
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == 'nightly'
    - if: "$CI_PROJECT_NAMESPACE != 'haproxy-controller/community' && $CI_PIPELINE_SOURCE == 'push'"
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-go$GO_VERSION
  services:
    - name: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-dind
      alias: docker
  tags:
    - go
  variables:
    GWAPI_VERSION: "1.5.0"
    CLUSTER_NAME: "conformance-1-5-0"
    CONFORMANCE_REPORT_OUTPUT: "${CI_PROJECT_DIR}/conformance-report-1.5.0.yaml"
    CONFORMANCE_JUNIT_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-1.5.0.xml"
    CONFORMANCE_JUNIT_HTML_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-1.5.0.html"
    HUG_SERVICE_TYPE: "ClusterIP"
  before_script:
    - export PATH=$PATH:/root/go/bin
    - docker login -u='$app' -p "$CI_REGISTRY_TOKEN" registry.haproxy.com
    - docker pull -q $HAPROXY_REGISTRY_GO/alpine:3
    - docker image tag $HAPROXY_REGISTRY_GO/alpine:3 alpine:3
    - docker pull -q $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine
    - docker image tag $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine golang:$GO_VERSION-alpine
    - sed -i "s~FROM golang~FROM $HAPROXY_REGISTRY_GO/golang~g" "build/Dockerfile"
    - sed -i "s~FROM haproxytech/haproxy-alpine~FROM $HAPROXY_REGISTRY_GO/haproxy-alpine~g" "build/Dockerfile"
    - docker build -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
  script:
    - task conformance-create-ci
    - task conformance-build-test-image
    - task conformance-run-job
  after_script:
    - task kind-delete
  artifacts:
    when: always
    paths:
      - conformance-report-1.5.0.yaml
      - conformance-junit-1.5.0.xml
      - conformance-junit-1.5.0.html
    reports:
      junit: conformance-junit-1.5.0.xml

conformance-MR-GW-API-1_5_0:
  allow_failure: false
  stage: conformance
  retry: 0
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push'
  image: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-go$GO_VERSION
  services:
    - name: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-dind
      alias: docker
  tags:
    - go
  variables:
    GWAPI_VERSION: "1.5.0"
    CLUSTER_NAME: "conformance-mr-1-5-0"
    CONFORMANCE_REPORT_OUTPUT: "${CI_PROJECT_DIR}/conformance-report-1.5.0.yaml"
    CONFORMANCE_JUNIT_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-1.5.0.xml"
    CONFORMANCE_JUNIT_HTML_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-1.5.0.html"
    CONFORMANCE_RUN_TEST: ""
    HUG_SERVICE_TYPE: "ClusterIP"
    # Pod label selector for conformance-collect-debug-mr.
    # When set, that task collects logs, haproxy.cfg and map files from the
    # matching HUG pod after the conformance run. The deployer intentionally
    # does NOT delete the pod when its gateway is removed, keeping it alive
    # so artifacts can be retrieved here before the cluster is torn down.
    # Leave empty (default) to skip collection entirely.
    # Example: "run=hug-4ff08ccae6d535c8"  (sha derived from gateway ns/name)
    HUG_LABEL_COLLECT_LOGS: ""
    CONFORMANCE_SKIP_TESTS: "\
      HTTPRouteHeaderMatching,\
      HTTPRouteInvalidBackendRefUnknownKind,\
      HTTPRouteInvalidCrossNamespaceBackendRef,\
      HTTPRouteInvalidNonExistentBackendRef,\
      HTTPRouteMatching,\
      HTTPRouteMatchingAcrossRoutes,\
      HTTPRouteRedirectHostAndStatus,\
      HTTPRouteRedirectPortAndScheme,\
      HTTPRouteServiceTypes,\
      HTTPRouteInvalidReferenceGrant,\
      HTTPRoutePartiallyInvalidViaInvalidReferenceGrant,\
      HTTPRouteReferenceGrant"
  before_script:
    - export PATH=$PATH:/root/go/bin
    - docker login -u='$app' -p "$CI_REGISTRY_TOKEN" registry.haproxy.com
    - docker pull -q $HAPROXY_REGISTRY_GO/alpine:3
    - docker image tag $HAPROXY_REGISTRY_GO/alpine:3 alpine:3
    - docker pull -q $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine
    - docker image tag $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine golang:$GO_VERSION-alpine
    - sed -i "s~FROM golang~FROM $HAPROXY_REGISTRY_GO/golang~g" "build/Dockerfile"
    - sed -i "s~FROM haproxytech/haproxy-alpine~FROM $HAPROXY_REGISTRY_GO/haproxy-alpine~g" "build/Dockerfile"
    - docker build -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
  script:
    - task conformance-create-ci
    - task conformance-build-test-image
    - task conformance-run-job
  after_script:
    - task conformance-collect-debug-mr || true
    - task kind-delete
  artifacts:
    when: always
    paths:
      - conformance-report-1.5.0.yaml
      - conformance-junit-1.5.0.xml
      - conformance-junit-1.5.0.html
      - debug-hug/
    reports:
      junit: conformance-junit-1.5.0.xml
