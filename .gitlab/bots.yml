pipelines-check:
  stage: bots
  needs: []
  image:
    name: $HAPROXY_REGISTRY_GO/golang:latest-alpine
    entrypoint: [ "" ]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: "$CI_PROJECT_NAMESPACE != 'haproxy-controller/community' && $CI_PIPELINE_SOURCE == 'push'"
  tags:
    - go
  script:
    - go run cmd/gitlab-mr-pipelines/main.go

mr-backport-question:
  stage: bots
  needs: []
  image:
    name: $HAPROXY_REGISTRY_GO/golang:latest-alpine
    entrypoint: [ "" ]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
  tags:
    - go
  script:
    - go run cmd/gitlab-mr-checker/main.go
