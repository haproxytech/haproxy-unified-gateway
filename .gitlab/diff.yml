diff:
  stage: diff
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: "$CI_PROJECT_NAMESPACE != 'haproxy-controller/community' && $CI_PIPELINE_SOURCE == 'push'"
  image:
    name: $HAPROXY_REGISTRY_GO/golang:latest-alpine
    entrypoint: [ "" ]
  tags:
    - go
  before_script:
    - task generate
  script:
    - test -z "$(git diff 2> /dev/null)" || git diff
    - test -z "$(git diff 2> /dev/null)" || junit-report add --status=failed --file=git-diff --message="git diff is not clean" --description="$(git diff)"
    - test -z "$(git diff 2> /dev/null)" || exit "Files are not generated, issue \`task generate\` and commit the result"
    - test -z "$(git ls-files --others --exclude-standard 2> /dev/null)" || git ls-files --others --exclude-standard
    - test -z "$(git ls-files --others --exclude-standard 2> /dev/null)" || junit-report add --status=failed --file=git-ls-files --message="Documentation created untracked files" --description="$(git ls-files --others --exclude-standard 2> /dev/null)"
    - test -z "$(git ls-files --others --exclude-standard 2> /dev/null)" || exit "Documentation created untracked files, cannot proceed"
    - junit-report add --status=ok --file=diff --message="Diff is clean" --description="Check for uncommitted changes in the repository"
  artifacts:
    when: on_failure
    paths:
      - junit-report.xml
    reports:
      junit: junit-report.xml
diff-crd:
  stage: diff
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: "$CI_PROJECT_NAMESPACE != 'haproxy-controller/community' && $CI_PIPELINE_SOURCE == 'push'"
  image:
    name: $HAPROXY_REGISTRY_GO/golang:latest-alpine
    entrypoint: [ "" ]
  tags:
    - go
  before_script:
    - task controller-gen
  script:
    - test -z "$(git diff 2> /dev/null)" || git diff
    - test -z "$(git diff 2> /dev/null)" || junit-report add --status=failed --file=git-diff --message="git diff is not clean" --description="$(git diff)"
    - test -z "$(git diff 2> /dev/null)" || exit "CRDs are not generated, issue \`task ci\` and commit the result"
    - test -z "$(git ls-files --others --exclude-standard 2> /dev/null)" || git ls-files --others --exclude-standard
    - test -z "$(git ls-files --others --exclude-standard 2> /dev/null)" || junit-report add --status=failed --file=git-ls-files --message="CRDs created untracked files" --description="$(git ls-files --others --exclude-standard 2> /dev/null)"
    - test -z "$(git ls-files --others --exclude-standard 2> /dev/null)" || exit "CRDs created untracked files, cannot proceed"
    - junit-report add --status=ok --file=diff --message="Diff is clean" --description="Check for uncommitted changes in the repository"
  artifacts:
    when: on_failure
    paths:
      - junit-report.xml
    reports:
      junit: junit-report.xml
check-large-files:
  stage: diff
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  image:
    name: $HAPROXY_REGISTRY_GO/golang:latest-alpine
    entrypoint: [ "" ]
  tags:
    - go
  script:
    # List all files in the latest commit that are larger than 1MB
    - |
      git fetch origin ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
      git diff --name-only origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}..HEAD | while read file; do
        if [ -f "$file" ] && [ $(stat -c%s "$file") -gt 1048576 ]; then
          echo "$file"
        fi
      done > large_files.txt

    # Fail the job if any file is larger than 1MB
    - |
      if [ -s large_files.txt ]; then
        echo "❌ The following files exceed 1MB:"
        cat large_files.txt
        junit-report add --status=failed --file=large-files --message="large files found" --description="$(cat large_files.txt)"
        exit 1
      else
        echo "✅ No large files found in the latest commit."
        junit-report add --status=ok --file=large-files --message="commit clean" --description="No large files found in the latest commit."
      fi
  artifacts:
    when: on_failure
    paths:
      - junit-report.xml
    reports:
      junit: junit-report.xml
