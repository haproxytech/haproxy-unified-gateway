# Job sets rendered into the conformance child pipeline by
# cmd/gitlab-conformance-jobs.
#
#   name:   the job name without its shard suffix; the trigger job in
#           .gitlab/conformance-tests.yml keeps the unsuffixed name so a green
#           MR means every shard passed.
#   stage:  the child pipeline stage the shard job runs in.
#   when:   mr_or_push -- the only value the generator accepts today.
#   shards: the suite's tests are dealt round robin across this many jobs, each
#           with its own kind cluster. Every test is skipped by the jobs that do
#           not own it, so the union still covers the whole suite; a tag or
#           nightly run stays unsharded to produce one complete report.
jobs:
  - name: conformance-MR-GW-API-1_7_0
    stage: conformance-tests
    when: mr_or_push
    shards: 6
