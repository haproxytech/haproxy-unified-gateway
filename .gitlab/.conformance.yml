# Body of one conformance shard, used by the merge-request and nightly runs alike.
# cmd/gitlab-conformance-jobs renders one job per shard into a child pipeline,
# each adding its shard number and the tests the other shards own.
.conformance-shard:
  allow_failure: false
  # One retry per shard: a flaky test now fails the MR from six independent
  # runs instead of one, and HTTPRouteMultipleGateways is a known flake.
  retry: 1
  image: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-go$GO_VERSION
  services:
    - name: $HAPROXY_REGISTRY_GO/docker:$DOCKER_VERSION-dind
      alias: docker
  tags:
    - go
  variables:
    # The dind service takes its storage driver from the job environment. Without
    # DOCKER_DRIVER, docker 29 falls back to the containerd image store, which
    # keeps a multi-platform index that kind cannot import --all-platforms.
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_DRIVER: "overlay2"
    # Runner kernels lack ip6table_raw; docker 29 needs it for IPv6 endpoints.
    DOCKER_INSECURE_NO_IPTABLES_RAW: "1"
    GWAPI_VERSION: "1.7.0"
    CLUSTER_NAME: "conformance-mr-1-7-0"
    # The shard number keeps each shard's result files apart, so the report job
    # can collect every shard's JUnit from one directory.
    CONFORMANCE_REPORT_OUTPUT: "${CI_PROJECT_DIR}/conformance-report-${GWAPI_VERSION}-${CONFORMANCE_SHARD}.yaml"
    CONFORMANCE_JUNIT_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}-${CONFORMANCE_SHARD}.xml"
    CONFORMANCE_JUNIT_HTML_OUTPUT: "${CI_PROJECT_DIR}/conformance-junit-${GWAPI_VERSION}-${CONFORMANCE_SHARD}.html"
    CONFORMANCE_RUN_TEST: ""
    HUG_SERVICE_TYPE: "ClusterIP"
    HUG_TEST_LISTENERSET: "1"
    # Pod label selector for conformance-collect-debug-mr.
    # When set, that task collects logs, haproxy.cfg and map files from the
    # matching HUG pod after the conformance run. The deployer intentionally
    # does NOT delete the pod when its gateway is removed, keeping it alive
    # so artifacts can be retrieved here before the cluster is torn down.
    # Leave empty (default) to skip collection entirely.
    # Example: "run=hug-4ff08ccae6d535c8"  (sha derived from gateway ns/name)
    HUG_LABEL_COLLECT_LOGS: ""
  before_script:
    - export PATH=$PATH:/root/go/bin
    - docker login -u='$app' -p "$CI_REGISTRY_TOKEN" registry.haproxy.com
    - docker pull -q $HAPROXY_REGISTRY_GO/alpine:3
    - docker image tag $HAPROXY_REGISTRY_GO/alpine:3 alpine:3
    - docker pull -q $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine
    - docker image tag $HAPROXY_REGISTRY_GO/golang:$GO_VERSION-alpine golang:$GO_VERSION-alpine
    - sed -i "s~FROM golang~FROM $HAPROXY_REGISTRY_GO/golang~g" "build/Dockerfile"
    - sed -i "s~FROM haproxytech/haproxy-alpine~FROM $HAPROXY_REGISTRY_GO/haproxy-alpine~g" "build/Dockerfile"
    - docker build -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
  script:
    - task conformance-create-ci
    - task conformance-build-test-image
    # Controller had ~2 min since deploy; dump its state before the suite scales it down.
    - task conformance-dump-controller-debug || true
    - task conformance-run-job
  after_script:
    - task conformance-dump-controller-debug STAGE=post-run || true
    - task conformance-collect-debug-mr || true
    - task kind-delete
  artifacts:
    when: always
    paths:
      - conformance-report-${GWAPI_VERSION}-${CONFORMANCE_SHARD}.yaml
      - conformance-junit-${GWAPI_VERSION}-${CONFORMANCE_SHARD}.xml
      - conformance-junit-${GWAPI_VERSION}-${CONFORMANCE_SHARD}.html
      - debug-hug/
    reports:
      junit: conformance-junit-${GWAPI_VERSION}-${CONFORMANCE_SHARD}.xml
