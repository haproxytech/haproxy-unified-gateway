#https://taskfile.dev/
version: '3'

tasks:
  controller-gen-cn-version:
    internal: true
    desc: 'Get the client-native controller-gen version'
    dir: api/gate/v3
    cmds:
      - |
        client_native_info=$(go list -m -f "{{ "{{" }}.Path}} {{ "{{" }}.Version}}" github.com/haproxytech/client-native/v6)
        echo "Client Native Version: $client_native_info"
        client_native_version=$(echo $client_native_info | awk '{print $2}')
        for file in *.go; do
            echo "$file"
            # Use sed to replace the version string in Go files with the new version
            sed -i  "s@// +kubebuilder:metadata:annotations=\"client-native.haproxy.org/version=.*\"@// +kubebuilder:metadata:annotations=\"client-native.haproxy.org/version=$client_native_version\"@" $file
        done

  controller-gen-deep-copy:
    internal: true
    desc: 'Generate code containing DeepCopy, DeepCopyInto, and DeepCopyObject method implementations.'
    deps:
      - task: check-go-tool
        vars:
          TOOL: CONTROLLER_GEN
    cmds:
      - $(check-go-tool {{.CONTROLLER_GEN}}) object:headerFile="assets/license-header.txt" paths="./..." output:artifacts:config=./api

  controller-gen-manifest:
    internal: true
    desc: "Generate CustomResourceDefinition objects."
    deps:
      - task: check-go-tool
        vars:
          TOOL: CONTROLLER_GEN
    cmds:
      - $(check-go-tool {{.CONTROLLER_GEN}}) crd webhook paths="./api/gate/..." output:crd:artifacts:config=./api/definition
      - |
        YQ=$(check-go-tool {{.YQ}})
        for file in api/definition/*.yaml; do
          $YQ eval 'del(.metadata.annotations."controller-gen.kubebuilder.io/version")' -i "$file"
        done
        # Remove name from backend CRD
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.required[] | select(. == "name")) | del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.name)' -i api/definition/gate.v3.haproxy.org_backends.yaml
        # Remove from Global CRD:
        # daemon, localpeer, master-worker, pidfile, stats_timeout, default_path, tune_lua_options.bool_sample_conversion, lua_options.load_per_thread
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.daemon)' -i api/definition/gate.v3.haproxy.org_globals.yaml
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.localpeer)' -i api/definition/gate.v3.haproxy.org_globals.yaml
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties."master-worker")' -i api/definition/gate.v3.haproxy.org_globals.yaml
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.pidfile)' -i api/definition/gate.v3.haproxy.org_globals.yaml
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.stats_timeout)' -i api/definition/gate.v3.haproxy.org_globals.yaml
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.default_path)' -i api/definition/gate.v3.haproxy.org_globals.yaml
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.tune_lua_options.properties.bool_sample_conversion)' -i api/definition/gate.v3.haproxy.org_globals.yaml
        $YQ eval 'del(.spec.versions[].schema.openAPIV3Schema.properties.spec.properties.lua_options.properties.load_per_thread)' -i api/definition/gate.v3.haproxy.org_globals.yaml
      - go run cmd/crd-version-check/main.go
