#https://taskfile.dev/
version: "3"

tasks:
  k0s-create-cluster:
    #internal: true
    # deps:
    #   - task: check-go-tool
    #     vars:
    #       TOOL: KIND
    silent: true
    desc: "create a k0s cluster with controller"
    status:
      - task check-if-ci-env # check if we are in CI_ENV, if we are, skip this task
    dir: "ci/k0s" # this file is imported so its fine
    cmds:
      # - docker-compose down --volumes --remove-orphans || true
      # - docker compose up -d
      - sh stop-k0s.sh
      - sh start-k0s.sh

  k0s-create-cluster-wait-ready:
    internal: true
    # deps:
    #   - task: check-go-tool
    #     vars:
    #       TOOL: KIND
    silent: true
    desc: "create a k0s cluster with controller"
    status:
      - task check-if-ci-env # check if we are in CI_ENV, if we are, skip this task
    dir: "ci/k0s" # this file is imported so its fine
    cmds:
      - echo -n "Waiting for k0s to be ready "
      - |
        until curl -s -k https://127.0.0.1:8443/version > /dev/null 2>&1; do
          echo -n "."
          sleep 1
        done
      - echo " OK"
      - echo -n "Waiting for kube-system pods to appear "
      - |
        until [ "$(kubectl get pods -n kube-system --no-headers 2>/dev/null | wc -l)" -gt 0 ]; do
          sleep 1
        done
        echo " OK"
        echo -n "Waiting for pods to be ready "
        while true; do
          echo -n "."
          not_ready=$(kubectl get pods -n kube-system --no-headers | grep -v 'Running' | wc -l)
          if [ "$not_ready" -eq 0 ]; then
            echo " OK"
            break
          else
            sleep 1
          fi
        done
      - kubectl get pods -A

  k0s-controller-build:
    desc: ""
    internal: true
    dir: cmd/controller
    cmds:
      - task generate-gwapi
      - CGO_ENABLED=0 go build -buildvcs=true -o ../../build/kubernetes-controller .

  k0s-build-controller-image-dev:
    #internal: true
    desc: "build docker image of controller"
    deps:
      - task: k0s-controller-build
    status:
      - task check-if-gitlab-env # check if we are in gitlab CI, if we are skip this task
    cmds:
      - docker build -t haproxytech/haproxy-unified-gateway -f build/Dockerfile.dev .
      - rm build/kubernetes-controller

  k0s-build-controller-image-build-in-docker:
    #internal: true
    desc: "build docker image of controller"
    deps:
      - task: k0s-controller-build
    status:
      - task check-if-gitlab-env # check if we are in gitlab CI, if we are skip this task
    cmds:
      - docker build -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
      - rm build/kubernetes-controller

  k0s-build-echo-image:
    internal: true
    desc: "build docker image of echo service"
    dir: ci/http-echo
    status:
      - "[ -f ../../.local/tar/echo.tar ]"
    cmds:
      - pwd
      - docker build --build-arg TARGETPLATFORM={{.TARGETPLATFORM}} -t haproxytech/http-echo .

  k0s-delete:
    desc: "delete a k0s cluster"
    dir: "ci/k0s" # this file is imported so its fine
    silent: true
    cmds:
      - sh stop-k0s.sh

  k0s-echo-create-tar:
    silent: true
    internal: true
    deps:
      - task: k0s-build-echo-image
    desc: "create tar of echo image"
    status:
      - "[ -f .local/tar/echo.tar ]"
    cmds:
      - mkdir -p .local/tar
      - docker save haproxytech/http-echo:latest -o .local/tar/echo.tar

  k0s-echo-upload:
    desc: "upload echo image to k0s cluster"
    silent: true
    internal: true
    cmds:
      - docker cp .local/tar/echo.tar k0s-hug-controller:/tmp/
      - docker exec k0s-hug-controller k0s ctr images import /tmp/echo.tar

  k0s-create:
    desc: "create a k0s cluster with HUG and one example app"
    silent: true
    vars:
      # can be set to 'k0s-build-controller-image-build-in-docker' if you want to build in the docker image
      CONTROLLER_BUILD_TASK: "k0s-build-controller-image-dev"
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
      - task: check-kubectl
    cmds:
      - task: delimiter
      - task: k0s-create-cluster
      - task: delimiter
      - task: "{{ .CONTROLLER_BUILD_TASK }}"
      - docker save haproxytech/haproxy-unified-gateway:latest -o hug.tar
      - task: k0s-echo-create-tar
      # - task: delimiter
      # - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      # - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/http-echo:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - task: k0s-create-cluster-wait-ready
      - docker cp hug.tar k0s-hug-controller:/tmp/
      - docker exec k0s-hug-controller k0s ctr images import /tmp/hug.tar
      - rm hug.tar
      - task: k0s-echo-upload
      #- rm echo.tar
      - task: delimiter
      - echo "Create HAProxy namespace ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/namespace.yaml
      - task: delimiter
      - echo "Install custom resource definitions ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/rbac.yaml
      - echo "Install Gateway API CRDs"
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-gwapi.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=60s job/haproxy-unified-gateway-gwapi -n haproxy-unified-gateway
      - echo "Install HUG CRDs"
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-crd.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=60s job/haproxy-unified-gateway-crd -n haproxy-unified-gateway
      - task: delimiter
      - echo "deploying Controller ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/hugconf.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/global.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug-dev/controller.yaml
      - echo "deploying a complete example in `example` namespace ..."
      - /{{.kubectl}} create ns example
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/echo.yaml
      - $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "deploying GatewayClass, Gateway, Secret, 2 HTTPRoutes"
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/offload-secret.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/gatewayclass.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/gateway.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/route.yaml
      - task: delimiter
      - /{{.kubectl}} wait --for=condition=ready --timeout=20s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway
      - kubectl get pods -A

  k0s-redeploy-controller:
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
      - task: check-kubectl
    desc: "redeploy a KinD cluster with IC"
    silent: true
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    cmds:
      - task: k0s-build-controller-image-dev
      - task: delimiter
      - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "deploying Controller ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug-dev/controller.yaml
      - task: delimiter
      - /{{.kubectl}} delete pods -l run=haproxy-unified-gateway -n haproxy-unified-gateway
      - /{{.kubectl}} wait --for=condition=ready --timeout=10s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway
