#https://taskfile.dev/
version: "3"

vars:
  # Images required by the Gateway API conformance test suite
  CONFORMANCE_ECHO_IMAGE: "gcr.io/k8s-staging-gateway-api/echo-basic:v20260204-monthly-2026.01-60-g28382302"
  CONFORMANCE_COREDNS_IMAGE: "registry.k8s.io/coredns/coredns:v1.12.2"

tasks:
  ### -----------------
  ### Tasks for CI
  ### -----------------
  conformance-prepare-controller-image:
    internal: true
    desc: "make the controller image for HUG_CONTROLLER_IMAGE_TAG available locally"
    vars:
      HUG_CONTROLLER_IMAGE_TAG: '{{default "latest" .HUG_CONTROLLER_IMAGE_TAG}}'
    cmds:
      - |
        if [ "{{.HUG_CONTROLLER_IMAGE_TAG}}" = "latest" ]; then
          echo "HUG_CONTROLLER_IMAGE_TAG=latest - using the locally built image"
        else
          docker pull haproxytech/haproxy-unified-gateway:{{.HUG_CONTROLLER_IMAGE_TAG}}
        fi

  conformance-pull-images:
    desc: "pre-pull images required by conformance tests"
    cmds:
      - docker pull {{.CONFORMANCE_ECHO_IMAGE}}
      - docker pull {{.CONFORMANCE_COREDNS_IMAGE}}

  conformance-create-ci:
    desc: "create a Kind cluster for conformance testing in Docker-in-Docker CI"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      # Forwarded to conformance-deploy-ci: task-local vars do not reach the
      # tasks a task calls, so the image tag must be named at every level.
      HUG_CONTROLLER_IMAGE_TAG: '{{default "latest" .HUG_CONTROLLER_IMAGE_TAG}}'
    cmds:
      - task: kind-create-cluster
        vars:
          KIND_CONFIG: "kind-config-conformance.yaml"
      - task: conformance-pull-images
      # Patch kubeconfig to use the dind service IP instead of 127.0.0.1.
      # In GitLab DinD, kind's containers are inside the dind daemon and not directly
      # reachable from the CI runner. The API server is reachable via the dind service
      # IP on the mapped port 7443.
      - |
        DOCKER_IP=$(getent hosts docker | awk '{ print $1 }')
        /{{.kubectl}} config set-cluster kind-{{.CLUSTER_NAME}} --server=https://${DOCKER_IP}:7443 --insecure-skip-tls-verify=true
      - task: conformance-deploy-ci
        vars:
          HUG_CONTROLLER_IMAGE_TAG: "{{.HUG_CONTROLLER_IMAGE_TAG}}"
      # Run the routing fix here
      - task: conformance-setup-routing-ci

  ## This task is specific for CI as it deploys hug-conformance-ci/controller.yaml
  conformance-deploy-ci:
    desc: "deploy HUG and prerequisites for conformance testing"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      CLUSTER_NAME: '{{ default "dev-controller" .CLUSTER_NAME }}'
      HUG_CONTROLLER_IMAGE_TAG: '{{default "latest" .HUG_CONTROLLER_IMAGE_TAG}}'
    cmds:
      # Load images into Kind (HUG + conformance test images)
      - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:{{.HUG_CONTROLLER_IMAGE_TAG}} --name={{.CLUSTER_NAME}}
      - cmd: $(check-go-tool {{.KIND}}) load docker-image {{.CONFORMANCE_ECHO_IMAGE}} --name={{.CLUSTER_NAME}}
      - cmd: $(check-go-tool {{.KIND}}) load docker-image {{.CONFORMANCE_COREDNS_IMAGE}} --name={{.CLUSTER_NAME}}
      # Create namespace
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/namespace.yaml
      # Install CRDs
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/rbac.yaml
      - |
        sed -e "s|haproxytech/haproxy-unified-gateway:latest|haproxytech/haproxy-unified-gateway:{{.HUG_CONTROLLER_IMAGE_TAG}}|g" \
          {{.CONFIG_DIR}}/crd-update/job-gwapi.yaml | /{{.kubectl}} apply -f -
      - /{{.kubectl}} wait --for=condition=complete --timeout=120s job/haproxy-unified-gateway-gwapi -n haproxy-unified-gateway
      - |
        sed -e "s|haproxytech/haproxy-unified-gateway:latest|haproxytech/haproxy-unified-gateway:{{.HUG_CONTROLLER_IMAGE_TAG}}|g" \
          {{.CONFIG_DIR}}/crd-update/job-crd.yaml | /{{.kubectl}} apply -f -
      - /{{.kubectl}} wait --for=condition=complete --timeout=120s job/haproxy-unified-gateway-crd -n haproxy-unified-gateway
      # Deploy controller
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/hugconf.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/global.yaml
      - |
        sed -e "s|haproxytech/haproxy-unified-gateway:latest|haproxytech/haproxy-unified-gateway:{{.HUG_CONTROLLER_IMAGE_TAG}}|g" \
          {{.CONFIG_DIR}}/hug-conformance-ci/controller.yaml | /{{.kubectl}} apply -f -
      # Wait for controller
      - /{{.kubectl}} wait --for=create --for=condition=ready --timeout=120s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway
      # Create GatewayClass for conformance
      - /{{.kubectl}} apply -f test/conformance/manifests/gatewayclass.yaml
      - echo "HUG deployed. Ready for conformance tests."

  conformance-setup-routing-ci:
    internal: true
    desc: "Log network info for CI debugging"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    cmds:
      - |
        DOCKER_HOST_IP=$(getent hosts docker | awk '{ print $1 }')
        TARGET_NODE_IP=$(/{{.kubectl}} get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' | awk '{print $1}')
        echo "--- Network Info ---"
        echo "DinD Host (Reachable): ${DOCKER_HOST_IP}"
        echo "Kind Node (Internal):  ${TARGET_NODE_IP}"
        echo "--------------------"


  conformance-deploy-metallb:
    desc: "install MetalLB in the kind cluster and configure a LoadBalancer IP pool from the kind network"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      METALLB_VERSION: "v0.14.9"
    cmds:
      - /{{.kubectl}} apply -f https://raw.githubusercontent.com/metallb/metallb/{{.METALLB_VERSION}}/config/manifests/metallb-native.yaml
      - /{{.kubectl}} wait --for=condition=established --timeout=60s crd/ipaddresspools.metallb.io crd/l2advertisements.metallb.io
      - /{{.kubectl}} wait --for=create --for=condition=ready --timeout=120s pod -l app=metallb,component=controller -n metallb-system
      - /{{.kubectl}} wait --for=create --for=condition=ready --timeout=120s pod -l app=metallb,component=speaker -n metallb-system
      - |
        SUBNET=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}} {{end}}' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+' | head -n 1)
        PREFIX=$(echo ${SUBNET} | cut -d. -f1-2)
        echo "MetalLB pool: ${PREFIX}.255.200-${PREFIX}.255.250"
        /{{.kubectl}} apply -f - <<EOF
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: kind-pool
          namespace: metallb-system
        spec:
          addresses:
          - ${PREFIX}.255.200-${PREFIX}.255.250
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: kind-l2
          namespace: metallb-system
        spec:
          ipAddressPools:
          - kind-pool
        EOF

  conformance-build-test-image:
    desc: "build the conformance test Docker image and load it into the kind cluster"
    cmds:
      - docker build --build-arg GO_VERSION=${GO_VERSION} -t haproxytech/hug-conformance:latest -f ci/conformance/Dockerfile .
      - $(check-go-tool {{.KIND}}) load docker-image haproxytech/hug-conformance:latest --name={{.CLUSTER_NAME}}

  ### Run the conformance tests as a Kubernetes Job inside the kind cluster, with results extracted via hostPath volume
  ### Used in CI
  conformance-run-job:
    desc: "run Gateway API conformance tests as a Kubernetes Job inside the kind cluster"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      CONFORMANCE_REPORT_OUTPUT: '{{default "conformance-report.yaml" .CONFORMANCE_REPORT_OUTPUT}}'
      CONFORMANCE_JUNIT_OUTPUT: '{{default "conformance-junit.xml" .CONFORMANCE_JUNIT_OUTPUT}}'
      CONFORMANCE_JUNIT_HTML_OUTPUT: '{{default "conformance-junit.html" .CONFORMANCE_JUNIT_HTML_OUTPUT}}'
      CONFORMANCE_RUN_TEST: '{{default "" .CONFORMANCE_RUN_TEST}}'
      CONFORMANCE_SKIP_TESTS: '{{default "" .CONFORMANCE_SKIP_TESTS}}'
      HUG_SERVICE_TYPE: '{{default "ClusterIP" .HUG_SERVICE_TYPE}}'
      HUG_IMPLEMENTATION_VERSION: '{{default "" .HUG_IMPLEMENTATION_VERSION}}'
      HUG_CONTROLLER_IMAGE_TAG: '{{default "latest" .HUG_CONTROLLER_IMAGE_TAG}}'
      HUG_TEST_LISTENERSET: '{{default "" .HUG_TEST_LISTENERSET}}'
    cmds:
      - |
        # 1. Apply the job
        sed \
          -e "s|\${CONFORMANCE_RUN_TEST}|{{.CONFORMANCE_RUN_TEST}}|g" \
          -e "s|\${CONFORMANCE_SKIP_TESTS}|{{.CONFORMANCE_SKIP_TESTS}}|g" \
          -e "s|\${HUG_SERVICE_TYPE}|{{.HUG_SERVICE_TYPE}}|g" \
          -e "s|\${HUG_IMPLEMENTATION_VERSION}|{{.HUG_IMPLEMENTATION_VERSION}}|g" \
          -e "s|\${HUG_CONTROLLER_IMAGE_TAG}|{{.HUG_CONTROLLER_IMAGE_TAG}}|g" \
          -e "s|\${HUG_TEST_LISTENERSET}|{{.HUG_TEST_LISTENERSET}}|g" \
          example/deploy/hug-conformance-ci/conformance-job.yaml | /{{.kubectl}} apply -f -

        # 2. Wait for success OR failure (Timeout after 90m)
        echo "Waiting for conformance tests to finish (Success or Failure)..."
        timeout 90m bash -c 'until /{{.kubectl}} wait job/conformance-tests --for=condition=Complete --timeout=1s 2>/dev/null || /{{.kubectl}} wait job/conformance-tests --for=condition=Failed --timeout=1s 2>/dev/null; do sleep 5; done' || echo "Wait timed out"

        # 3. CRITICAL: Add a small sleep to ensure hostPath is synced
        sleep 5

        # 4. Debug: Check if the file actually exists on the node before copying
        echo "Checking for results on Kind node..."
        docker exec {{.CLUSTER_NAME}}-control-plane ls -lh /tmp/conformance-results/

        # 5. Extract reports from kind docker container
        echo "Streaming reports from Kind node..."
        docker exec {{.CLUSTER_NAME}}-control-plane cat /tmp/conformance-results/junit.xml > {{.CONFORMANCE_JUNIT_OUTPUT}}
        docker exec {{.CLUSTER_NAME}}-control-plane cat /tmp/conformance-results/conformance-report.yaml > {{.CONFORMANCE_REPORT_OUTPUT}}

        # 6. Check Job Status for final exit code
        SUCCESS_VAL=$(/{{.kubectl}} get job conformance-tests -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)
        if [ "${SUCCESS_VAL}" = "1" ]; then
          JOB_STATUS=0
          echo "✅ Job completed with SUCCESS."
        else
          JOB_STATUS=1
          echo "❌ Job completed with FAILURE."
        fi

        # 7. Generate HTML (Only if XML exists to avoid crash)
        if [ -f "{{.CONFORMANCE_JUNIT_OUTPUT}}" ]; then
           go run ./cmd/junit-report/main.go {{.CONFORMANCE_JUNIT_OUTPUT}} {{.CONFORMANCE_JUNIT_HTML_OUTPUT}}
        else
           echo "Warning: JUnit XML not found, skipping HTML generation."
        fi

        exit ${JOB_STATUS}

  conformance-publish-ci:
    desc: "run the suite for a release version and package the upstream conformance-report MR payload"
    deps:
      - task: check-kubectl
    vars:
      HUG_IMPLEMENTATION_VERSION: '{{.HUG_IMPLEMENTATION_VERSION}}'
      HUG_CONTROLLER_IMAGE_TAG: '{{default (trimPrefix "v" .HUG_IMPLEMENTATION_VERSION) .HUG_CONTROLLER_IMAGE_TAG}}'
      CONFORMANCE_REPORT_OUTPUT: '{{default "conformance-report.yaml" .CONFORMANCE_REPORT_OUTPUT}}'
      # Skip list for the published run. Resolved here so an override never
      # depends on GitLab's variable precedence: HUG_CONFORMANCE_SKIP_TESTS, set
      # at pipeline-run time, wins; otherwise the whole suite runs, which on an
      # older tag means failures and nothing publishable.
      CONFORMANCE_SKIP_TESTS: '{{default .CONFORMANCE_SKIP_TESTS .HUG_CONFORMANCE_SKIP_TESTS}}'
      PUBLISH_DIR: '{{default "publish" .PUBLISH_DIR}}'
    # Each call passes vars explicitly. A task's own `vars:` and `env:` reach that
    # task's commands but NOT the tasks it calls — task-local vars do not leak
    # transitively — so anything a sub-task needs must be named on its call, and
    # forwarded again at every level below.
    cmds:
      - |
        if [ -z "{{.HUG_IMPLEMENTATION_VERSION}}" ]; then
          echo "HUG_IMPLEMENTATION_VERSION is required (e.g. v1.0.7)" >&2
          exit 1
        fi
      - task: conformance-prepare-controller-image
        vars:
          HUG_CONTROLLER_IMAGE_TAG: '{{.HUG_CONTROLLER_IMAGE_TAG}}'
      - task: conformance-create-ci
        vars:
          HUG_CONTROLLER_IMAGE_TAG: '{{.HUG_CONTROLLER_IMAGE_TAG}}'
      - task: conformance-build-test-image
      - task: conformance-run-job
        vars:
          HUG_IMPLEMENTATION_VERSION: '{{.HUG_IMPLEMENTATION_VERSION}}'
          HUG_CONTROLLER_IMAGE_TAG: '{{.HUG_CONTROLLER_IMAGE_TAG}}'
          CONFORMANCE_REPORT_OUTPUT: '{{.CONFORMANCE_REPORT_OUTPUT}}'
          CONFORMANCE_SKIP_TESTS: '{{.CONFORMANCE_SKIP_TESTS}}'
      - task: conformance-package
        vars:
          HUG_IMPLEMENTATION_VERSION: '{{.HUG_IMPLEMENTATION_VERSION}}'
          HUG_CONTROLLER_IMAGE_TAG: '{{.HUG_CONTROLLER_IMAGE_TAG}}'
          CONFORMANCE_REPORT_OUTPUT: '{{.CONFORMANCE_REPORT_OUTPUT}}'
          CONFORMANCE_SKIP_TESTS: '{{.CONFORMANCE_SKIP_TESTS}}'
          PUBLISH_DIR: '{{.PUBLISH_DIR}}'

  conformance-package:
    desc: "validate the report and build the upstream MR payload plus provenance"
    vars:
      HUG_IMPLEMENTATION_VERSION: '{{.HUG_IMPLEMENTATION_VERSION}}'
      HUG_CONTROLLER_IMAGE_TAG: '{{default "latest" .HUG_CONTROLLER_IMAGE_TAG}}'
      CONFORMANCE_REPORT_OUTPUT: '{{default "conformance-report.yaml" .CONFORMANCE_REPORT_OUTPUT}}'
      CONFORMANCE_SKIP_TESTS: '{{default "" .CONFORMANCE_SKIP_TESTS}}'
      PUBLISH_DIR: '{{default "publish" .PUBLISH_DIR}}'
    cmds:
      - go run ./cmd/conformance-publish --tag {{.HUG_IMPLEMENTATION_VERSION}} --report {{.CONFORMANCE_REPORT_OUTPUT}} --out {{.PUBLISH_DIR}}/upstream
      - |
        mkdir -p {{.PUBLISH_DIR}}
        DIGEST=$(docker inspect haproxytech/haproxy-unified-gateway:{{.HUG_CONTROLLER_IMAGE_TAG}} 2>/dev/null \
          | grep -oE 'haproxytech/haproxy-unified-gateway@sha256:[a-f0-9]+' | head -n1 || true)
        {
          echo "version={{.HUG_IMPLEMENTATION_VERSION}}"
          echo "controller_image=haproxytech/haproxy-unified-gateway:{{.HUG_CONTROLLER_IMAGE_TAG}}"
          echo "controller_image_digest=${DIGEST:-unavailable}"
          echo "skip_tests={{.CONFORMANCE_SKIP_TESTS}}"
          echo "gateway_api_version=$(grep -m1 '^gatewayAPIVersion:' {{.CONFORMANCE_REPORT_OUTPUT}} | awk '{print $2}')"
          echo "commit=$(git rev-parse HEAD)"
          echo "pipeline=${CI_PIPELINE_ID:-local}"
          echo "job=${CI_JOB_ID:-local}"
        } > {{.PUBLISH_DIR}}/provenance.txt
        cat {{.PUBLISH_DIR}}/provenance.txt

  conformance-publish-github:
    desc: "push the upstream MR payload as a commit to a dev-v<major.minor> branch on haproxyci/gateway-api"
    vars:
      HUG_IMPLEMENTATION_VERSION: '{{.HUG_IMPLEMENTATION_VERSION}}'
      PUBLISH_DIR: '{{default "publish" .PUBLISH_DIR}}'
      # The fork is a User-owned mirror; it is reached over SSH with a deploy key.
      GWAPI_FORK_REPO: '{{default "git@github.com:haproxyci/gateway-api.git" .GWAPI_FORK_REPO}}'
      GWAPI_UPSTREAM_REPO: '{{default "https://github.com/kubernetes-sigs/gateway-api.git" .GWAPI_UPSTREAM_REPO}}'
      GITHUB_BOT_NAME: '{{default "haproxyci" .GITHUB_BOT_NAME}}'
      GITHUB_BOT_EMAIL: '{{default "haproxyci@haproxy.com" .GITHUB_BOT_EMAIL}}'
    # Everything runs in one shell: ssh-agent's environment (SSH_AUTH_SOCK) is
    # established by `eval` here, and neither an export nor an ssh-agent survives
    # a command boundary in this runner.
    cmds:
      - |
        set -euo pipefail

        if [ -z "{{.HUG_IMPLEMENTATION_VERSION}}" ]; then
          echo "HUG_IMPLEMENTATION_VERSION is required (e.g. v1.0.7)" >&2
          exit 1
        fi

        # The report lands on a per-minor staging branch on the fork,
        # dev-v<major.minor>, derived from the implementation version
        # (v1.0.7 -> dev-v1.0). Never the fork's main: main stays a plain mirror
        # of upstream, and each minor line gets its own branch.
        BRANCH="dev-$(printf '%s' "{{.HUG_IMPLEMENTATION_VERSION}}" | grep -oE '^v[0-9]+\.[0-9]+' || true)"
        if [ "$BRANCH" = "dev-" ]; then
          echo "HUG_IMPLEMENTATION_VERSION must be v<major>.<minor>.<patch> (e.g. v1.0.7); got '{{.HUG_IMPLEMENTATION_VERSION}}'" >&2
          exit 1
        fi
        echo "target branch: ${BRANCH}"

        PAYLOAD="$(cd "{{.PUBLISH_DIR}}/upstream" && pwd)"
        REPORT=$(find "$PAYLOAD/conformance/reports" -name "*-{{.HUG_IMPLEMENTATION_VERSION}}-*-report.yaml" -print -quit)
        if [ -z "$REPORT" ]; then
          echo "no report for {{.HUG_IMPLEMENTATION_VERSION}} under $PAYLOAD; run conformance-publish-ci first" >&2
          exit 1
        fi

        # Both fields are read from the report so the message cannot drift from
        # what was actually published. The convention, per upstream's own report
        # commits, is "<project> <gateway API version> conformance report".
        PROJECT=$(grep -m1 '^  project:' "$REPORT" | awk '{print $2}')
        GW_VERSION=$(grep -m1 '^gatewayAPIVersion:' "$REPORT" | awk '{print $2}')
        if [ -z "$PROJECT" ] || [ -z "$GW_VERSION" ]; then
          echo "could not read implementation.project / gatewayAPIVersion from $REPORT" >&2
          exit 1
        fi
        MESSAGE="Update ${PROJECT} ${GW_VERSION} conformance report"
        echo "commit message: ${MESSAGE}"

        # The payload's implementation folder, and the same path relative to the
        # checkout root. Everything below stays inside this folder.
        SRC_FOLDER=$(dirname "$REPORT")
        REL_FOLDER="conformance/reports/$(basename "$(dirname "$SRC_FOLDER")")/$(basename "$SRC_FOLDER")"

        # We keep a single version per implementation, so the table must have
        # exactly one row. A freshly rendered README has one; a stale one spliced
        # from a leftover output directory can have more, so refuse rather than
        # commit a second row.
        ROWS=$(grep -c '/releases/tag/' "$PAYLOAD/$REL_FOLDER/README.md" || true)
        if [ "$ROWS" -ne 1 ]; then
          echo "README table must have exactly one row, found $ROWS: $PAYLOAD/$REL_FOLDER/README.md" >&2
          exit 1
        fi

        if [ -z "${HAPROXY_CI_GWAPI_PRIVATE_KEY:-}" ]; then
          echo "HAPROXY_CI_GWAPI_PRIVATE_KEY must hold the path to the deploy key file" >&2
          exit 1
        fi
        # GitLab strips the trailing newline off a variable's value, and an
        # OpenSSH/PEM key needs it: ssh-add reports the missing newline with the
        # same opaque "error in libcrypto" as a corrupt key. Restore it, so the
        # only key that reaches ssh-add is a well-formed one. The append is a
        # no-op on a value that already ends in a newline.
        if [ -n "$(tail -c1 "$HAPROXY_CI_GWAPI_PRIVATE_KEY")" ]; then
          printf '\n' >> "$HAPROXY_CI_GWAPI_PRIVATE_KEY"
        fi
        # The variable is a File-type CI/CD variable, so its value is the path to
        # a temp file holding the key. Guard the file, not just the variable: the
        # path is non-empty even when the file is empty. And ssh-add answers a
        # bare "error in libcrypto" for an empty file, for a key whose newlines
        # were stripped, and for one with CRLF alike - so verify here, and say
        # what was actually found, rather than leaving that opaque failure.
        chmod 600 "$HAPROXY_CI_GWAPI_PRIVATE_KEY"
        KEY_BYTES=$(wc -c < "$HAPROXY_CI_GWAPI_PRIVATE_KEY")
        KEY_LINES=$(wc -l < "$HAPROXY_CI_GWAPI_PRIVATE_KEY")
        echo "deploy key file: ${KEY_BYTES} bytes, ${KEY_LINES} lines"
        if [ "$KEY_BYTES" -eq 0 ]; then
          echo "HAPROXY_CI_GWAPI_PRIVATE_KEY points at an empty file" >&2
          exit 1
        fi
        if command -v ssh-keygen >/dev/null 2>&1 \
           && ! ssh-keygen -y -P '' -f "$HAPROXY_CI_GWAPI_PRIVATE_KEY" >/dev/null 2>&1; then
          echo "deploy key file is not a usable private key (${KEY_BYTES} bytes, ${KEY_LINES} lines)." >&2
          echo "A raw key must keep its line breaks - the current key is 8 lines. Fewer means the value was pasted mangled." >&2
          exit 1
        fi
        eval "$(ssh-agent -s)"
        ssh-add "$HAPROXY_CI_GWAPI_PRIVATE_KEY"
        # The job is non-interactive, so it cannot answer a host-key prompt; trust
        # github.com up front or the first clone fails verification.
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

        WORK=$(mktemp -d)
        # Not a shallow clone. We commit on top of upstream/main, and a shallow
        # history would make the push a "shallow update", which the receiving side
        # refuses (receive.shallowUpdate is false on GitHub, as on any bare repo):
        # the fork rejects it with "shallow update not allowed". The full history
        # has to be here for the push to carry it.
        git clone "{{.GWAPI_FORK_REPO}}" "$WORK/gateway-api"
        cd "$WORK/gateway-api"
        git config user.name "{{.GITHUB_BOT_NAME}}"
        git config user.email "{{.GITHUB_BOT_EMAIL}}"

        # Base the commit on upstream, not on the fork's branch: the fork's branch
        # may be behind, and committing on top of it would put unrelated upstream
        # drift into the MR diff. The branch becomes upstream/main + exactly our
        # commit.
        git remote add upstream "{{.GWAPI_UPSTREAM_REPO}}"
        git fetch upstream main
        git checkout -B "$BRANCH" upstream/main

        # Keep exactly one published version per implementation: drop whatever
        # reports are already in this folder on the checkout, then lay down the
        # payload's single report and README. Deletion and addition land in the
        # same commit, so the folder never holds two versions. Only upstream is
        # consulted: the checkout was reset to upstream/main above, so anything the
        # fork's branch carried was already discarded and cannot survive into the
        # commit. A previous release is present here when its MR was merged; if it
        # was not, there is simply nothing to delete.
        rm -f "$REL_FOLDER"/*-report.yaml
        cp -r "$PAYLOAD/conformance" .

        # Post-condition, so "one version" holds by assertion and not only by the
        # reasoning above: the folder about to be committed must hold exactly one
        # yaml file - the report. Counting every *.yaml rather than *-report.yaml
        # makes this broader than the delete above, so a file the delete would not
        # have matched fails the run loudly instead of surviving unnoticed.
        REMAINING=$(find "$REL_FOLDER" -maxdepth 1 -name '*.yaml' | wc -l)
        if [ "$REMAINING" -ne 1 ]; then
          echo "expected exactly one report in $REL_FOLDER, found $REMAINING:" >&2
          find "$REL_FOLDER" -maxdepth 1 -name '*.yaml' >&2
          exit 1
        fi

        git add -A conformance
        git commit -s -m "${MESSAGE}"

        if [ -n "${HUG_GITHUB_DRY_RUN:-}" ]; then
          echo "HUG_GITHUB_DRY_RUN is set: stopping before the push. To be pushed:"
          git show --stat --oneline HEAD
          exit 0
        fi

        # The branch is rewritten onto upstream/main on every run, so the push is
        # forced by design; --force-with-lease still refuses if the fork's branch
        # moved since the clone, rather than clobbering a change we never saw.
        git push --force-with-lease origin "$BRANCH"

  conformance-dump-controller-debug:
    desc: "dump default controller pods, logs and GatewayClass status for CI debugging"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      DEBUG_DIR: '{{default "debug-hug" .DEBUG_DIR}}'
      HUG_NS: "haproxy-unified-gateway"
      # STAGE distinguishes dumps taken before and after the conformance run.
      STAGE: '{{default "pre-run" .STAGE}}'
    cmds:
      - mkdir -p "{{.DEBUG_DIR}}"
      - |
        OUT="{{.DEBUG_DIR}}/controller-{{.STAGE}}"
        /{{.kubectl}} get pods -n {{.HUG_NS}} -o wide > "${OUT}-pods.txt" 2>&1 || true
        /{{.kubectl}} describe pods -n {{.HUG_NS}} -l run=haproxy-unified-gateway > "${OUT}-describe.txt" 2>&1 || true
        /{{.kubectl}} logs -n {{.HUG_NS}} deploy/haproxy-unified-gateway --all-containers --tail=-1 > "${OUT}-logs.txt" 2>&1 || true
        /{{.kubectl}} logs -n {{.HUG_NS}} deploy/haproxy-unified-gateway --all-containers --previous > "${OUT}-logs-previous.txt" 2>&1 || true
        /{{.kubectl}} get gatewayclass haproxy -o yaml > "${OUT}-gatewayclass.yaml" 2>&1 || true
        /{{.kubectl}} get events -n {{.HUG_NS}} --sort-by=.lastTimestamp > "${OUT}-events.txt" 2>&1 || true
        echo "Controller debug dump ({{.STAGE}}) written to {{.DEBUG_DIR}}"

  conformance-collect-debug-mr:
    desc: "collect HUG pod logs and HAProxy config/maps for post-mortem debugging (MR CI job)"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      DEBUG_DIR: '{{default "debug-hug" .DEBUG_DIR}}'
      HUG_NS: "haproxy-unified-gateway"
      # HUG_LABEL_COLLECT_LOGS: pod label selector for debug artifact collection.
      # When set, collects logs, haproxy.cfg and map files from the matching HUG pod.
      # The deployer intentionally does NOT delete the pod when its gateway is removed,
      # keeping it alive so artifacts can be retrieved here before cluster teardown.
      # Leave empty (default) to skip collection entirely.
      # Example: "run=hug-4ff08ccae6d535c8"  (sha derived from gateway ns/name)
      HUG_LABEL_COLLECT_LOGS: '{{default "" .HUG_LABEL_COLLECT_LOGS}}'
    cmds:
      - |
        if [ -z "{{.HUG_LABEL_COLLECT_LOGS}}" ]; then
          echo "HUG_LABEL_COLLECT_LOGS is not set — skipping debug collection"
          exit 0
        fi
      - mkdir -p "{{.DEBUG_DIR}}"
      - |
        POD=$(/{{.kubectl}} get pod -n {{.HUG_NS}} -l {{.HUG_LABEL_COLLECT_LOGS}} \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        if [ -z "$POD" ]; then
          echo "No pod with label {{.HUG_LABEL_COLLECT_LOGS}} found — skipping debug collection"
          exit 0
        fi
        echo "Collecting debug artifacts from pod: $POD (label: {{.HUG_LABEL_COLLECT_LOGS}})"
        /{{.kubectl}} logs -n {{.HUG_NS}} "$POD" > "{{.DEBUG_DIR}}/hug-pod.log" 2>&1 || true
        /{{.kubectl}} exec -n {{.HUG_NS}} "$POD" -- cat /usr/local/hug/haproxy.cfg \
          > "{{.DEBUG_DIR}}/haproxy.cfg" 2>/dev/null || true
        MAP_DIR=/usr/local/hug/maps/hug_https_443
        for MAP in \
          listener_exact_match.map \
          listener_wildcard_match.map \
          listener_route_exact_match.map \
          listener_route_wildcard_match.map \
          path_exact.map \
          path_prefix.map \
          path_regex.map; do
          /{{.kubectl}} exec -n {{.HUG_NS}} "$POD" -- cat "${MAP_DIR}/${MAP}" \
            > "{{.DEBUG_DIR}}/${MAP}" 2>/dev/null || true
        done
        echo "Debug artifacts written to {{.DEBUG_DIR}}"

  ### -----------------
  ### Tasks used for local tests
  ### Conformance tester runs outside the cluster
  ### -----------------

  ## To run a specific test: set env variable
  ##    CONFORMANCE_RUN_TEST
  ## To skip some tests and run all others: set env variable CONFORMANCE_SKIP_TESTS (comma separated list of ShortNames)
  ##    CONFORMANCE_SKIP_TESTS
  conformance-run:
    desc: "run Gateway API conformance tests (cluster must be ready)"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOTESTSUM
    vars:
      FORMAT: '{{default "testdox" .FORMAT}}'
      # Left empty on purpose: the run directory resolved below is what names the three outputs,
      # and a caller that pins one of them -- CI does, because its diff job fetches the previous
      # run by artifact name -- keeps its own path.
      CONFORMANCE_OUTPUT_DIR: '{{default "" .CONFORMANCE_OUTPUT_DIR}}'
      CONFORMANCE_REPORT_OUTPUT: '{{default "" .CONFORMANCE_REPORT_OUTPUT}}'
      CONFORMANCE_JUNIT_OUTPUT: '{{default "" .CONFORMANCE_JUNIT_OUTPUT}}'
      CONFORMANCE_JUNIT_HTML_OUTPUT: '{{default "" .CONFORMANCE_JUNIT_HTML_OUTPUT}}'
      CONFORMANCE_RUN_TEST: '{{default "" .CONFORMANCE_RUN_TEST}}'
      CONFORMANCE_SKIP_TESTS: '{{default "" .CONFORMANCE_SKIP_TESTS}}'
      SEQUENTIAL: '{{default "false" .SEQUENTIAL}}'
      # go test's own ceiling. A campaign can outlast it: every test that fails burns its own
      # deadline, and the timeout is then reported as if every unfinished test had failed --
      # "0 passed, N failed, 0 skipped" for a run that was merely cut short.
      CONFORMANCE_TEST_TIMEOUT: '{{default "60m" .CONFORMANCE_TEST_TIMEOUT}}'
    cmds:
      - |
        # Every run keeps its own directory. A campaign takes minutes and its report is the only
        # record of it, so a later run must not be able to overwrite an earlier one.
        RUN_DIR="{{.CONFORMANCE_OUTPUT_DIR}}"
        [ -n "$RUN_DIR" ] || RUN_DIR="conformance-runs/$(date +%Y%m%dT%H%M%S)"
        mkdir -p "$RUN_DIR"

        REPORT="{{.CONFORMANCE_REPORT_OUTPUT}}"
        [ -n "$REPORT" ] || REPORT="$RUN_DIR/conformance-report.yaml"
        JUNIT="{{.CONFORMANCE_JUNIT_OUTPUT}}"
        [ -n "$JUNIT" ] || JUNIT="$RUN_DIR/conformance-junit.xml"
        JUNIT_HTML="{{.CONFORMANCE_JUNIT_HTML_OUTPUT}}"
        [ -n "$JUNIT_HTML" ] || JUNIT_HTML="$RUN_DIR/conformance-junit.html"
        echo "Conformance run directory: $RUN_DIR"

        if CONFORMANCE_REPORT_OUTPUT="$REPORT" \
          $(check-go-tool {{.GOTESTSUM}}) \
            --format-icons=hivis \
            --format={{.FORMAT}} \
            --format-hide-empty-pkg \
            --junitfile "$JUNIT" \
            -- ./test/conformance/ \
              -count=1 \
              -tags=conformance \
              -timeout {{.CONFORMANCE_TEST_TIMEOUT}} \
              -v \
              {{if eq .SEQUENTIAL "true"}}-p 1{{end}}\
              {{if .CONFORMANCE_RUN_TEST}}-run-test '{{.CONFORMANCE_RUN_TEST}}'{{end}} \
              {{if .CONFORMANCE_SKIP_TESTS}}-skip-tests '{{.CONFORMANCE_SKIP_TESTS}}'{{end}}; then
          RUN_STATUS=0
        else
          RUN_STATUS=1
        fi
        go run ./cmd/junit-report/main.go "$JUNIT" "$JUNIT_HTML" || true
        exit ${RUN_STATUS}

  conformance-report:
    desc: "print passed/skipped/failed summary from a JUnit XML report (defaults to the most recent local run)"
    vars:
      CONFORMANCE_JUNIT_OUTPUT: '{{default "" .CONFORMANCE_JUNIT_OUTPUT}}'
      CONFORMANCE_JUNIT_HTML_OUTPUT: '{{default "" .CONFORMANCE_JUNIT_HTML_OUTPUT}}'
    cmds:
      - |
        JUNIT="{{.CONFORMANCE_JUNIT_OUTPUT}}"
        [ -n "$JUNIT" ] || JUNIT="$(ls -1dt conformance-runs/*/ 2>/dev/null | head -1)conformance-junit.xml"
        HTML="{{.CONFORMANCE_JUNIT_HTML_OUTPUT}}"
        [ -n "$HTML" ] || HTML="$(dirname "$JUNIT")/conformance-junit.html"
        go run ./cmd/junit-report/main.go "$JUNIT" "$HTML"
