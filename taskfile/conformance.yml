#https://taskfile.dev/
version: "3"

vars:
  # Images required by the Gateway API conformance test suite
  CONFORMANCE_ECHO_IMAGE: "gcr.io/k8s-staging-gateway-api/echo-basic:v20260204-monthly-2026.01-60-g28382302"
  CONFORMANCE_COREDNS_IMAGE: "registry.k8s.io/coredns/coredns:v1.12.2"

tasks:
  ### -----------------
  ### Tasks for CI
  ### -----------------
  conformance-pull-images:
    desc: "pre-pull images required by conformance tests"
    cmds:
      - docker pull {{.CONFORMANCE_ECHO_IMAGE}}
      - docker pull {{.CONFORMANCE_COREDNS_IMAGE}}

  conformance-create-ci:
    desc: "create a Kind cluster for conformance testing in Docker-in-Docker CI"
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    cmds:
      - task: kind-create-cluster
        vars:
          KIND_CONFIG: "kind-config-conformance.yaml"
      - task: conformance-pull-images
      # Patch kubeconfig to use the dind service IP instead of 127.0.0.1.
      # In GitLab DinD, kind's containers are inside the dind daemon and not directly
      # reachable from the CI runner. The API server is reachable via the dind service
      # IP on the mapped port 7443.
      - |
        DOCKER_IP=$(getent hosts docker | awk '{ print $1 }')
        /{{.kubectl}} config set-cluster kind-{{.CLUSTER_NAME}} --server=https://${DOCKER_IP}:7443 --insecure-skip-tls-verify=true
      - task: conformance-deploy-ci
      # Run the routing fix here
      - task: conformance-setup-routing-ci

  ## This task is specific for CI as it deploys hug-conformance-ci/controller.yaml
  conformance-deploy-ci:
    desc: "deploy HUG and prerequisites for conformance testing"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      CLUSTER_NAME: '{{ default "dev-controller" .CLUSTER_NAME }}'
    cmds:
      # Load images into Kind (HUG + conformance test images)
      - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - cmd: $(check-go-tool {{.KIND}}) load docker-image {{.CONFORMANCE_ECHO_IMAGE}} --name={{.CLUSTER_NAME}}
      - cmd: $(check-go-tool {{.KIND}}) load docker-image {{.CONFORMANCE_COREDNS_IMAGE}} --name={{.CLUSTER_NAME}}
      # Create namespace
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/namespace.yaml
      # Install CRDs
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-gwapi.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=120s job/haproxy-unified-gateway-gwapi -n haproxy-unified-gateway
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-crd.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=120s job/haproxy-unified-gateway-crd -n haproxy-unified-gateway
      # Deploy controller
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/hugconf.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/global.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug-conformance-ci/controller.yaml
      # Wait for controller
      - /{{.kubectl}} wait --for=condition=ready --timeout=120s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway
      # Create GatewayClass for conformance
      - /{{.kubectl}} apply -f test/conformance/manifests/gatewayclass.yaml
      - echo "HUG deployed. Ready for conformance tests."

  conformance-setup-routing-ci:
    internal: true
    desc: "Log network info for CI debugging"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    cmds:
      - |
        DOCKER_HOST_IP=$(getent hosts docker | awk '{ print $1 }')
        TARGET_NODE_IP=$(/{{.kubectl}} get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' | awk '{print $1}')
        echo "--- Network Info ---"
        echo "DinD Host (Reachable): ${DOCKER_HOST_IP}"
        echo "Kind Node (Internal):  ${TARGET_NODE_IP}"
        echo "--------------------"


  conformance-deploy-metallb:
    desc: "install MetalLB in the kind cluster and configure a LoadBalancer IP pool from the kind network"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      METALLB_VERSION: "v0.14.9"
    cmds:
      - /{{.kubectl}} apply -f https://raw.githubusercontent.com/metallb/metallb/{{.METALLB_VERSION}}/config/manifests/metallb-native.yaml
      - /{{.kubectl}} wait --for=condition=established --timeout=60s crd/ipaddresspools.metallb.io crd/l2advertisements.metallb.io
      - /{{.kubectl}} wait --for=condition=ready --timeout=120s pod -l app=metallb,component=controller -n metallb-system
      - /{{.kubectl}} wait --for=condition=ready --timeout=120s pod -l app=metallb,component=speaker -n metallb-system
      - |
        SUBNET=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}} {{end}}' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+' | head -n 1)
        PREFIX=$(echo ${SUBNET} | cut -d. -f1-2)
        echo "MetalLB pool: ${PREFIX}.255.200-${PREFIX}.255.250"
        /{{.kubectl}} apply -f - <<EOF
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: kind-pool
          namespace: metallb-system
        spec:
          addresses:
          - ${PREFIX}.255.200-${PREFIX}.255.250
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: kind-l2
          namespace: metallb-system
        spec:
          ipAddressPools:
          - kind-pool
        EOF

  conformance-build-test-image:
    desc: "build the conformance test Docker image and load it into the kind cluster"
    cmds:
      - docker build --build-arg GO_VERSION=${GO_VERSION} -t haproxytech/hug-conformance:latest -f ci/conformance/Dockerfile .
      - $(check-go-tool {{.KIND}}) load docker-image haproxytech/hug-conformance:latest --name={{.CLUSTER_NAME}}

  ### Run the conformance tests as a Kubernetes Job inside the kind cluster, with results extracted via hostPath volume
  ### Used in CI
  conformance-run-job:
    desc: "run Gateway API conformance tests as a Kubernetes Job inside the kind cluster"
    deps:
      - task: check-kubectl
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      CONFORMANCE_REPORT_OUTPUT: '{{default "conformance-report.yaml" .CONFORMANCE_REPORT_OUTPUT}}'
      CONFORMANCE_JUNIT_OUTPUT: '{{default "conformance-junit.xml" .CONFORMANCE_JUNIT_OUTPUT}}'
      CONFORMANCE_JUNIT_HTML_OUTPUT: '{{default "conformance-junit.html" .CONFORMANCE_JUNIT_HTML_OUTPUT}}'
      CONFORMANCE_RUN_TEST: '{{default "" .CONFORMANCE_RUN_TEST}}'
      CONFORMANCE_SKIP_TESTS: '{{default "" .CONFORMANCE_SKIP_TESTS}}'
    cmds:
      - |
        # 1. Apply the job
        sed \
          -e "s|\${CONFORMANCE_RUN_TEST}|{{.CONFORMANCE_RUN_TEST}}|g" \
          -e "s|\${CONFORMANCE_SKIP_TESTS}|{{.CONFORMANCE_SKIP_TESTS}}|g" \
          example/deploy/hug-conformance-ci/conformance-job.yaml | /{{.kubectl}} apply -f -

        # 2. Wait for success OR failure (Timeout after 90m)
        echo "Waiting for conformance tests to finish (Success or Failure)..."
        timeout 90m bash -c 'until /{{.kubectl}} wait job/conformance-tests --for=condition=Complete --timeout=1s 2>/dev/null || /{{.kubectl}} wait job/conformance-tests --for=condition=Failed --timeout=1s 2>/dev/null; do sleep 5; done' || echo "Wait timed out"

        # 3. CRITICAL: Add a small sleep to ensure hostPath is synced
        sleep 5

        # 4. Debug: Check if the file actually exists on the node before copying
        echo "Checking for results on Kind node..."
        docker exec {{.CLUSTER_NAME}}-control-plane ls -lh /tmp/conformance-results/

        # 5. Extract reports from kind docker container
        echo "Streaming reports from Kind node..."
        docker exec {{.CLUSTER_NAME}}-control-plane cat /tmp/conformance-results/junit.xml > {{.CONFORMANCE_JUNIT_OUTPUT}}
        docker exec {{.CLUSTER_NAME}}-control-plane cat /tmp/conformance-results/conformance-report.yaml > {{.CONFORMANCE_REPORT_OUTPUT}}

        # 6. Check Job Status for final exit code
        SUCCESS_VAL=$(/{{.kubectl}} get job conformance-tests -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)
        if [ "${SUCCESS_VAL}" = "1" ]; then
          JOB_STATUS=0
          echo "✅ Job completed with SUCCESS."
        else
          JOB_STATUS=1
          echo "❌ Job completed with FAILURE."
        fi

        # 7. Generate HTML (Only if XML exists to avoid crash)
        if [ -f "{{.CONFORMANCE_JUNIT_OUTPUT}}" ]; then
           go run ./cmd/junit-report/main.go {{.CONFORMANCE_JUNIT_OUTPUT}} {{.CONFORMANCE_JUNIT_HTML_OUTPUT}}
        else
           echo "Warning: JUnit XML not found, skipping HTML generation."
        fi

        exit ${JOB_STATUS}

  ### -----------------
  ### Tasks used for local tests
  ### Conformance tester runs outside the cluster
  ### -----------------

  ## To run a specific test: set env variable
  ##    CONFORMANCE_RUN_TEST
  ## To skip some tests and run all others: set env variable CONFORMANCE_SKIP_TESTS (comma separated list of ShortNames)
  ##    CONFORMANCE_SKIP_TESTS
  conformance-run:
    desc: "run Gateway API conformance tests (cluster must be ready)"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOTESTSUM
    vars:
      FORMAT: '{{default "testdox" .FORMAT}}'
      CONFORMANCE_REPORT_OUTPUT: '{{default "conformance-report.yaml" .CONFORMANCE_REPORT_OUTPUT}}'
      CONFORMANCE_JUNIT_OUTPUT: '{{default "conformance-junit.xml" .CONFORMANCE_JUNIT_OUTPUT}}'
      CONFORMANCE_JUNIT_HTML_OUTPUT: '{{default "conformance-junit.html" .CONFORMANCE_JUNIT_HTML_OUTPUT}}'
      CONFORMANCE_RUN_TEST: '{{default "" .CONFORMANCE_RUN_TEST}}'
      CONFORMANCE_SKIP_TESTS: '{{default "" .CONFORMANCE_SKIP_TESTS}}'
    cmds:
      - |
        if CONFORMANCE_REPORT_OUTPUT={{.CONFORMANCE_REPORT_OUTPUT}} \
          $(check-go-tool {{.GOTESTSUM}}) \
            --format-icons=hivis \
            --format={{.FORMAT}} \
            --format-hide-empty-pkg \
            --junitfile {{.CONFORMANCE_JUNIT_OUTPUT}} \
            -- ./test/conformance/ \
              -count=1 \
              -tags=conformance \
              -timeout 60m \
              -v \
              {{if .CONFORMANCE_RUN_TEST}}-run-test '{{.CONFORMANCE_RUN_TEST}}'{{end}} \
              {{if .CONFORMANCE_SKIP_TESTS}}-skip-tests '{{.CONFORMANCE_SKIP_TESTS}}'{{end}}; then
          RUN_STATUS=0
        else
          RUN_STATUS=1
        fi
        go run ./cmd/junit-report/main.go {{.CONFORMANCE_JUNIT_OUTPUT}} {{.CONFORMANCE_JUNIT_HTML_OUTPUT}} || true
        exit ${RUN_STATUS}

  conformance-report:
    desc: "print passed/skipped/failed summary from a JUnit XML report"
    vars:
      CONFORMANCE_JUNIT_OUTPUT: '{{default "conformance-junit.xml" .CONFORMANCE_JUNIT_OUTPUT}}'
      CONFORMANCE_JUNIT_HTML_OUTPUT: '{{default "conformance-junit.html" .CONFORMANCE_JUNIT_HTML_OUTPUT}}'
    cmds:
      - go run ./cmd/junit-report/main.go {{.CONFORMANCE_JUNIT_OUTPUT}} {{.CONFORMANCE_JUNIT_HTML_OUTPUT}}
