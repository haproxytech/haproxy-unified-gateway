#https://taskfile.dev/
version: "3"

tasks:
  check-if-gitlab-env:
    internal: true
    cmds:
      - '[ -z "$GITLAB_CI" ] && exit 1 || exit 0'
  check-if-ci-env:
    internal: true
    cmds:
      - '[ -z "$CI_ENV" ]    && exit 1 || exit 0'
  check-if-not-ci-env:
    internal: true
    cmds:
      - '[ -z "$CI_ENV" ]    && exit 0 || exit 1'
  delimiter:
    internal: true
    cmds:
      - cmd: printf %80s |tr " " "="; echo ""
        silent: true

  kind-create-cluster:
    #internal: true
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
    desc: "create a KinD cluster with controller"
    status:
      - task check-if-ci-env # check if we are in CI_ENV, if we are, skip this task
    vars:
      kind: "{{.TMP}}/kind/{{.KIND_VERSION}}/kind"
      KIND_CONFIG: '{{.KIND_CONFIG | default "kind-config.yaml"}}'
    dir: "ci/kind" # this file is imported so its fine
    cmds:
      - /{{.kind}} delete cluster --name {{.CLUSTER_NAME}}
      - echo "Creating kind cluster {{.CLUSTER_NAME}} with config {{.KIND_CONFIG}} ..."
      - /{{.kind}} create cluster --name {{.CLUSTER_NAME}} --config {{.KIND_CONFIG}} --image kindest/node:{{.K8S_VERSION}}

  kind-controller-build:
    desc: ""
    internal: true
    dir: cmd/controller
    cmds:
      - task generate-gwapi
      - CGO_ENABLED=0 go build -buildvcs=true -o ../../build/kubernetes-controller .

  kind-build-controller-image-dev:
    #internal: true
    desc: "build docker image of controller"
    deps:
      - task: kind-controller-build
    status:
      - task check-if-gitlab-env # check if we are in gitlab CI, if we are skip this task
    cmds:
      - docker build --network=host -t haproxytech/haproxy-unified-gateway -f build/Dockerfile.dev .
      - rm build/kubernetes-controller

  kind-build-controller-image-build-in-docker:
    #internal: true
    desc: "build docker image of controller"
    deps:
      - task: kind-controller-build
    status:
      - task check-if-gitlab-env # check if we are in gitlab CI, if we are skip this task
    cmds:
      - docker build --network=host -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
      - rm build/kubernetes-controller

  kind-build-echo-image:
    internal: true
    desc: "build docker image of echo service"
    dir: ci/http-echo
    status:
      - docker images | grep haproxytech/http-echo
    cmds:
      - pwd
      - docker build --build-arg TARGETPLATFORM={{.TARGETPLATFORM}} -t haproxytech/http-echo .

  kind-cloud-provider-start:
    desc: "start cloud-provider-kind in background (assigns IPs to LoadBalancer services)"
    deps:
      - task: check-go-tool
        vars:
          TOOL: CLOUD_PROVIDER_KIND
    vars:
      cpk: "{{.TMP}}/cloud-provider-kind/{{.CLOUD_PROVIDER_KIND_VERSION}}/cloud-provider-kind --gateway-channel=disabled"
      pidfile: "/tmp/cloud-provider-kind-{{.CLUSTER_NAME}}.pid"
      logfile: "/tmp/cloud-provider-kind-{{.CLUSTER_NAME}}.log"
    cmds:
      - nohup /{{.cpk}} > {{.logfile}} 2>&1 & echo $! > {{.pidfile}}
      - echo "cloud-provider-kind started (pid=$(cat {{.pidfile}}), log={{.logfile}})"

  kind-cloud-provider-stop:
    desc: "stop cloud-provider-kind background process"
    vars:
      pidfile: "/tmp/cloud-provider-kind-{{.CLUSTER_NAME}}.pid"
    cmds:
      - |
        pkill -f cloud-provider-kind 2>/dev/null || true
        rm -f {{.pidfile}}
        echo "cloud-provider-kind stopped"

  kind-delete:
    desc: "delete a KinD cluster"
    silent: true
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
    vars:
      kind: "{{.TMP}}/kind/{{.KIND_VERSION}}/kind"
    cmds:
      - task: kind-cloud-provider-stop
      - "/{{.kind}} delete cluster --name {{.CLUSTER_NAME}}"

  kind-create:
    desc: "create a KinD cluster for local debug (start Hug in local) (no host port maps as we have a LoadBalancer service)"
    cmds:
      - task: kind-create-internal
        vars:
          KIND_CONFIG: "kind-config.yaml"

  kind-create-internal:
    internal: true
    desc: "create a KinD cluster with HUG and one example app"
    silent: true
    vars:
      # set in .env CONTROLLER_BUILD_TASK=kind-build-controller-image-dev to speed build times
      CONTROLLER_BUILD_TASK: '{{.CONTROLLER_BUILD_TASK | default "kind-build-controller-image-build-in-docker"}}'
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      kind: "{{.TMP}}/kind/{{.KIND_VERSION}}/kind"
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
      - task: check-kubectl
    cmds:
      - task: delimiter
      - task: kind-create-cluster
        vars:
          KIND_CONFIG: "{{.KIND_CONFIG}}"
      - task: kind-cloud-provider-start
      - task: delimiter
      - task: "{{ .CONTROLLER_BUILD_TASK }}"
      - task: kind-build-echo-image
      - task: delimiter
      - cmd: /{{.kind}} load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - cmd: /{{.kind}} load docker-image haproxytech/http-echo:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "Create HAProxy namespace ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/namespace.yaml
      - task: delimiter
      - echo "Install custom resource definitions ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/rbac.yaml
      - echo "Install Gateway API CRDs"
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-gwapi.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=60s job/haproxy-unified-gateway-gwapi -n haproxy-unified-gateway
      - echo "Install HUG CRDs"
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-crd.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=60s job/haproxy-unified-gateway-crd -n haproxy-unified-gateway
      - task: delimiter
      - echo "deploying Controller ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/hugconf.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/global.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug-dev/controller.yaml
      - task: delimiter
      - echo "deploying a complete example in `example` namespace ..."
      - /{{.kubectl}} create ns example
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/echo.yaml
      - /{{.kind}} load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "deploying GatewayClass, Gateway, Secret, 2 HTTPRoutes"
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/offload-secret.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/gatewayclass.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/gateway.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/route.yaml
      - task: delimiter
      - /{{.kubectl}} wait --for=condition=ready --timeout=10s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway

  kind-redeploy-controller:
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
      - task: check-kubectl
    desc: "redeploy a KinD cluster with IC"
    silent: true
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
      kind: "{{.TMP}}/kind/{{.KIND_VERSION}}/kind"
    cmds:
      - task: kind-build-controller-image-dev
      - task: delimiter
      - cmd: /{{.kind}} load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "deploying Controller ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug-dev/controller.yaml
      - task: delimiter
      - /{{.kubectl}} delete pods -l run=haproxy-unified-gateway -n haproxy-unified-gateway
      - /{{.kubectl}} wait --for=condition=ready --timeout=10s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway
