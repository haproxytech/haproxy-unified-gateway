#https://taskfile.dev/
version: "3"

tasks:
  check-if-gitlab-env:
    internal: true
    cmds:
      - '[ -z "$GITLAB_CI" ] && exit 1 || exit 0'
  check-if-ci-env:
    internal: true
    cmds:
      - '[ -z "$CI_ENV" ]    && exit 1 || exit 0'
  check-if-not-ci-env:
    internal: true
    cmds:
      - '[ -z "$CI_ENV" ]    && exit 0 || exit 1'
  delimiter:
    internal: true
    cmds:
      - cmd: printf %80s |tr " " "="; echo ""
        silent: true

  kind-create-cluster:
    #internal: true
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
    desc: "create a KinD cluster with controller"
    status:
      - task check-if-ci-env # check if we are in CI_ENV, if we are, skip this task
    vars:
      KIND_CONFIG: '{{.KIND_CONFIG | default "kind-config.yaml"}}'
    dir: "ci/kind" # this file is imported so its fine
    cmds:
      - $(check-go-tool {{.KIND}}) delete cluster --name {{.CLUSTER_NAME}}
      - echo "Creating kind cluster {{.CLUSTER_NAME}} with config {{.KIND_CONFIG}} ..."
      - $(check-go-tool {{.KIND}}) create cluster --name {{.CLUSTER_NAME}} --config {{.KIND_CONFIG}} --image kindest/node:{{.K8S_VERSION}}

  kind-controller-build:
    desc: ""
    internal: true
    dir: cmd/controller
    cmds:
      - task generate-gwapi
      - CGO_ENABLED=0 go build -buildvcs=true -o ../../build/kubernetes-controller .

  kind-build-controller-image-dev:
    #internal: true
    desc: "build docker image of controller"
    deps:
      - task: kind-controller-build
    status:
      - task check-if-gitlab-env # check if we are in gitlab CI, if we are skip this task
    cmds:
      - docker build --network=host -t haproxytech/haproxy-unified-gateway -f build/Dockerfile.dev .
      - rm build/kubernetes-controller

  kind-build-controller-image-build-in-docker:
    #internal: true
    desc: "build docker image of controller"
    deps:
      - task: kind-controller-build
    status:
      - task check-if-gitlab-env # check if we are in gitlab CI, if we are skip this task
    cmds:
      - docker build --network=host -t haproxytech/haproxy-unified-gateway -f build/Dockerfile .
      - rm build/kubernetes-controller

  kind-build-echo-image:
    internal: true
    desc: "build docker image of echo service"
    dir: ci/http-echo
    status:
      - docker images | grep haproxytech/http-echo
    cmds:
      - pwd
      - docker build --build-arg TARGETPLATFORM={{.TARGETPLATFORM}} -t haproxytech/http-echo .

  kind-cloud-provider-start:
    desc: "start cloud-provider-kind in background (assigns IPs to LoadBalancer services)"
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [KIND, CLOUD_PROVIDER_KIND]
    vars:
      pidfile: "/tmp/cloud-provider-kind-{{.CLUSTER_NAME}}.pid"
      logfile: "/tmp/cloud-provider-kind-{{.CLUSTER_NAME}}.log"
      kubeconfig: "/tmp/kind-{{.CLUSTER_NAME}}.kubeconfig"
    cmds:
      # The provider reads the ambient kubeconfig, so starting it without pinning one can
      # serve ANOTHER cluster while looking perfectly healthy: it runs, its log is normal,
      # and the Services of the cluster named here stay LoadBalancer ingress pending for
      # ever. CLUSTER_NAME already names this cluster for the pidfile and the log; the
      # process has to be given the same answer.
      - |
        KUBECONFIG={{.kubeconfig}} $(check-go-tool {{.KIND}}) export kubeconfig --name {{.CLUSTER_NAME}}
      # A second provider is not a second address: it competes for the same host ports.
      # Asked by name, not from the pidfile: a pidfile left by a dead attempt would refuse a
      # start that is legitimate, and $! is not the provider's pid (see below).
      - |
        running=$(pgrep -f 'cloud-provider-kind.*--gateway-channel=disabled' | head -1 || true)
        if [ -n "$running" ]; then
          echo "cloud-provider-kind already running (pid=$running); run kind-cloud-provider-stop first"
          exit 1
        fi
      # Appended, not truncated: the previous attempt's log is the evidence of why this one
      # may not work, and overwriting it is what made this fail silently before.
      - |
        KUBECONFIG={{.kubeconfig}} nohup $(check-go-tool {{.CLOUD_PROVIDER_KIND}}) --gateway-channel=disabled >> {{.logfile}} 2>&1 &
      # Started is not running, so it is waited for. The pid is asked for by name: $! is the
      # subshell the shell forked for this background job, and with a command substitution in
      # that job's command line the subshell goes away while the provider runs -- which made an
      # earlier version of this check report a healthy provider as dead.
      - |
        sleep 3
        provider_pid=$(pgrep -f 'cloud-provider-kind.*--gateway-channel=disabled' | head -1 || true)
        if [ -z "$provider_pid" ]; then
          echo "cloud-provider-kind is not running; last lines of {{.logfile}}:"
          tail -n 20 {{.logfile}}
          rm -f {{.pidfile}}
          exit 1
        fi
        echo $provider_pid > {{.pidfile}}
        echo "cloud-provider-kind running for cluster {{.CLUSTER_NAME}} (pid=$provider_pid, kubeconfig={{.kubeconfig}}, log={{.logfile}})"
        echo "  check it is addressing Services: docker ps --filter name=kindccm; kubectl get svc -A | rg -i loadbalancer"

  kind-cloud-provider-stop:
    desc: "stop cloud-provider-kind background process, and its orphaned Envoy proxies"
    vars:
      pidfile: "/tmp/cloud-provider-kind-{{.CLUSTER_NAME}}.pid"
    cmds:
      - |
        pkill -f cloud-provider-kind 2>/dev/null || true
        rm -f {{.pidfile}}
      # The proxies are containers with a restart policy: they outlive the process that
      # created them, and they hold the host ports a new provider needs. An orphan left
      # behind is why a restarted provider cannot publish an address at all.
      - |
        orphans=$(docker ps -aq --filter name=kindccm- 2>/dev/null || true)
        if [ -n "$orphans" ]; then
          docker rm -f $orphans >/dev/null
          echo "removed $(echo $orphans | wc -w) orphaned cloud-provider-kind proxy container(s)"
        fi
        echo "cloud-provider-kind stopped"

  kind-delete:
    desc: "delete a KinD cluster"
    silent: true
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
    cmds:
      - task: kind-cloud-provider-stop
      - $(check-go-tool {{.KIND}}) delete cluster --name {{.CLUSTER_NAME}}

  kind-create:
    desc: "create a KinD cluster for local debug (start Hug in local) (no host port maps as we have a LoadBalancer service)"
    cmds:
      - task: kind-create-internal
        vars:
          KIND_CONFIG: "kind-config.yaml"
          HUG_CONTROLLER_DEPLOYMENT: "{{.CONFIG_DIR}}/hug-dev/controller.yaml"

  kind-create-internal:
    internal: true
    desc: "create a KinD cluster with HUG and one example app"
    silent: true
    vars:
      # set in .env CONTROLLER_BUILD_TASK=kind-build-controller-image-dev to speed build times
      CONTROLLER_BUILD_TASK: '{{.CONTROLLER_BUILD_TASK | default "kind-build-controller-image-build-in-docker"}}'
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
      - task: check-kubectl
    cmds:
      - task: delimiter
      - task: kind-create-cluster
        vars:
          KIND_CONFIG: "{{.KIND_CONFIG}}"
      - task: kind-cloud-provider-start
      - task: delimiter
      - task: "{{ .CONTROLLER_BUILD_TASK }}"
      - task: kind-build-echo-image
      - task: delimiter
      - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/http-echo:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "Create HAProxy namespace ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/namespace.yaml
      - task: delimiter
      - echo "Install custom resource definitions ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/rbac.yaml
      - echo "Install Gateway API CRDs"
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-gwapi.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=60s job/haproxy-unified-gateway-gwapi -n haproxy-unified-gateway
      - echo "Install HUG CRDs"
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/crd-update/job-crd.yaml
      - /{{.kubectl}} wait --for=condition=complete --timeout=60s job/haproxy-unified-gateway-crd -n haproxy-unified-gateway
      - task: delimiter
      - echo "deploying Controller ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/hugconf.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/global.yaml
      - task: kind-deploy-hug
        vars:
          HUG_CONTROLLER_DEPLOYMENT: '{{.HUG_CONTROLLER_DEPLOYMENT}}'
      - task: delimiter
      - echo "deploying a complete example in `example` namespace ..."
      - /{{.kubectl}} create ns example
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/echo.yaml
      - $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "deploying GatewayClass, Gateway, Secret, 2 HTTPRoutes"
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/offload-secret.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/gatewayclass.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/gateway.yaml
      - /{{.kubectl}} apply -n example -f {{.DEV_INIT_DIR}}/route.yaml
      - task: delimiter
      - /{{.kubectl}} wait --for=create --for=condition=ready --timeout=10s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway

  kind-deploy-hug:
    internal: true
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
      - task: check-kubectl
    cmds:
      - echo "deploying Controller from {{.HUG_CONTROLLER_DEPLOYMENT}} ..."
      - /{{.kubectl}} apply -f {{.HUG_CONTROLLER_DEPLOYMENT}}


  kind-redeploy-controller:
    deps:
      - task: check-go-tool
        vars:
          TOOL: KIND
      - task: check-kubectl
    desc: "redeploy a KinD cluster with IC"
    silent: true
    vars:
      kubectl: "{{.TMP}}/kubectl/{{.KUBECTL_VERSION}}/kubectl"
    cmds:
      - task: kind-build-controller-image-dev
      - task: delimiter
      - cmd: $(check-go-tool {{.KIND}}) load docker-image haproxytech/haproxy-unified-gateway:latest --name={{.CLUSTER_NAME}}
      - task: delimiter
      - echo "deploying Controller ..."
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug/rbac.yaml
      - /{{.kubectl}} apply -f {{.CONFIG_DIR}}/hug-dev/controller.yaml
      - task: delimiter
      - /{{.kubectl}} delete pods -l run=haproxy-unified-gateway -n haproxy-unified-gateway
      - /{{.kubectl}} wait --for=create --for=condition=ready --timeout=10s pod -l run=haproxy-unified-gateway -n haproxy-unified-gateway
