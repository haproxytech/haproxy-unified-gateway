processes:
  - name: haproxy
    command: /usr/local/sbin/haproxy_wrapper
    args: ["-W", "-db", "-m", "{{mem 66%}}", "-S", "/var/run/haproxy-master.sock,level,admin", "-f", "/usr/local/hug/haproxy.cfg", "-f", "/usr/local/hug/aux"]
    stop-signal: SIGUSR1
    kill-delay: 30s
    on-success: restart
    on-failure: restart
    environment:
      LD_PRELOAD: /usr/local/lib/libblock_secrets.so
    on-check-failure:
      haproxy-health: restart

  - name: hug
    command: /usr/local/sbin/hug
    args: ["--with-gopherd"]
    use-entrypoint-args: true
    pass-env: true
    after: [haproxy]
    ready-check: haproxy-health
    ready-timeout: 30s
    on-success: shutdown
    on-failure: restart
    environment:
      GOMEMLIMIT: "{{mem 33%}}MiB"

checks:
  haproxy-health:
    http:
      url: http://localhost/healthz
      socket: /var/run/haproxy/health.sock
    period: 5s
    timeout: 2s
    threshold: 3
    initial-delay: 10s

control:
  socket: /run/gopherd.sock
