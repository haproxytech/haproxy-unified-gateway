global
    tune.lua.bool-sample-conversion normal
    stats socket {{ADMIN_SOCK}} mode 660 level admin
    lua-load-per-thread {{ROUTE_LUA}}

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend fe
    bind unix@{{HTTP_SOCK}}
    http-request set-var(txn.reversed) req.hdr(Host),host_only,lua.reverse_host
    http-request return status 200 content-type "text/plain" lf-string "%[var(txn.reversed)]"
