global
    tune.lua.bool-sample-conversion normal
    stats socket {{ADMIN_SOCK}} mode 660 level admin
    lua-load-per-thread {{ROUTE_LUA}}

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend fe
    bind unix@{{HTTP_SOCK}}
    # Route specs live in maps/routes.map; tests pass a short name via header.
    acl _preload_routes str(_),map({{DIR}}/maps/routes.map) -m found
    http-request set-var(txn.route) req.hdr(X-Route-Name),map({{DIR}}/maps/routes.map)
    http-request lua.route
    http-request return status 200 content-type "text/plain" lf-string "backend=%[var(txn.backend)]"

backend be_one
    mode http
    server s1 127.0.0.1:1
