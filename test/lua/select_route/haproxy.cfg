global
    tune.lua.bool-sample-conversion normal
    stats socket {{ADMIN_SOCK}} mode 660 level admin
    lua-load-per-thread {{ROUTE_LUA}}

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend fe
    bind unix@{{HTTP_SOCK}}

    # Pre-load all maps at config-parse time so core.get_patref can reach them.
    acl _preload_l_exact    str(_),map({{DIR}}/maps/fe/listener_exact_match.map)              -m found
    acl _preload_l_wild     str(_),map_beg({{DIR}}/maps/fe/listener_wildcard_match.map)       -m found
    acl _preload_lr_exact   str(_),map({{DIR}}/maps/fe/listener_route_exact_match.map)        -m found
    acl _preload_lr_wild    str(_),map_beg({{DIR}}/maps/fe/listener_route_wildcard_match.map) -m found
    acl _preload_p_exact    str(_),map({{DIR}}/maps/fe/path_exact.map)                        -m found
    acl _preload_p_prefix   str(_),map_beg({{DIR}}/maps/fe/path_prefix.map)                  -m found
    acl _preload_p_regex    str(_),map_reg({{DIR}}/maps/fe/path_regex.map)                   -m found

    acl route_is_json var(txn.route),bytes(0,1) -m str {
    acl route_is_cond var(txn.route),bytes(0,1) -m str ~

    http-request set-var(txn.path)         path
    http-request set-var(txn.host)         req.hdr(Host),host_only

    # Listener / listener-route selection (exact host only).
    http-request set-var(txn.selected_listener_name)             var(txn.host),map({{DIR}}/maps/fe/listener_exact_match.map)
    http-request set-var(txn.tmp_exact) var(txn.selected_listener_name),concat("/",txn.host)
    http-request set-var(txn.selected_listener_route) var(txn.tmp_exact),map({{DIR}}/maps/fe/listener_route_exact_match.map)

    # Fast path (mirrors the production httpFrontendRules chain).
    http-request set-var(txn.lr) var(txn.selected_listener_route) if { var(txn.selected_listener_route) -m reg ^[^,]+$ }
    http-request set-var(txn.blr) var(txn.lr),concat("",txn.path)
    http-request set-var(txn.route) var(txn.blr),map({{DIR}}/maps/fe/path_exact.map)
    http-request set-var(txn.route,ifnotexists) var(txn.blr),map_beg({{DIR}}/maps/fe/path_prefix.map)
    http-request set-var(txn.route,ifnotexists) var(txn.blr),map_reg({{DIR}}/maps/fe/path_regex.map)

    # Conditional values: evaluate candidates, fall through to less specific
    # entries, or leave no route so the request 404s.
    http-request lua.select_route {{DIR}}/maps/fe if route_is_cond

    http-request lua.route if route_is_json

    use_backend %[var(txn.backend)] if route_is_json
    use_backend %[var(txn.route)]
    default_backend backend_not_found

backend be_ping_one
    http-request return status 200 content-type "text/plain" string "be_ping_one"
backend be_ping
    http-request return status 200 content-type "text/plain" string "be_ping"
backend be_post_ver
    http-request return status 200 content-type "text/plain" string "be_post_ver"
backend be_post
    http-request return status 200 content-type "text/plain" string "be_post"
backend be_orange
    http-request return status 200 content-type "text/plain" string "be_orange"
backend be_one
    http-request return status 200 content-type "text/plain" string "be_one"
backend be_two
    http-request return status 200 content-type "text/plain" string "be_two"
backend be_blue
    http-request return status 200 content-type "text/plain" string "be_blue"
backend be_green
    http-request return status 200 content-type "text/plain" string "be_green"
backend be_vregex
    http-request return status 200 content-type "text/plain" string "be_vregex"
backend be_whale
    http-request return status 200 content-type "text/plain" string "be_whale"
backend be_admin
    http-request return status 200 content-type "text/plain" string "be_admin"
backend be_old
    http-request return status 200 content-type "text/plain" string "be_old"
backend be_spaced
    http-request return status 200 content-type "text/plain" string "be_spaced"
backend be_default
    http-request return status 200 content-type "text/plain" string "be_default"
backend backend_not_found
    http-request return status 404 content-type "text/plain" string "NOT FOUND"
