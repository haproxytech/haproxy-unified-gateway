global
    tune.lua.bool-sample-conversion normal
    stats socket {{ADMIN_SOCK}} mode 660 level admin
    lua-load-per-thread {{ROUTE_LUA}}

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend fe
    bind unix@{{HTTP_SOCK}}
    # Route specs live in maps/routes.map; tests pass a short name via header.
    acl _preload_routes str(_),map({{DIR}}/maps/routes.map) -m found
    http-request set-var(txn.route) req.hdr(X-Route-Name),map({{DIR}}/maps/routes.map)
    http-request lua.route
    http-request return status 200 content-type "text/plain" lf-string "backend=%[var(txn.backend)]"

# Backends used across the weighted-random tests. Each has one server so
# srv_act >= 1 — relevant only for the failover tests, but harmless for wr.
backend be_only
    mode http
    server s1 127.0.0.1:1

backend be_never
    mode http
    server s1 127.0.0.1:1

# Used by Failover_AllUnavailable AND the wr distribution test. No `server`
# lines → srv_act = 0 for the failover case; wr doesn't inspect server health.
backend be_a
    mode http

backend be_b
    mode http

# Failover pair: be_empty has 0 servers, be_with_server has 1.
backend be_empty
    mode http

backend be_with_server
    mode http
    server s1 127.0.0.1:1

# Failover pair where both qualify; fo picks the first listed.
backend be_first
    mode http
    server s1 127.0.0.1:1

backend be_second
    mode http
    server s1 127.0.0.1:1

backend be_default
    mode http
    server s1 127.0.0.1:1
