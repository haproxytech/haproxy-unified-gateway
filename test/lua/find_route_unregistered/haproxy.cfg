global
    tune.lua.bool-sample-conversion normal
    stats socket {{ADMIN_SOCK}} mode 660 level admin
    lua-load-per-thread {{ROUTE_LUA}}

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend fe
    bind unix@{{HTTP_SOCK}}

    # NO preload ACLs — find_route's core.get_patref will fail. We assert the
    # action handles that gracefully (alert + nil) without crashing.

    http-request set-var(txn.path) path
    http-request set-var(txn.selected_listener_route) str(lr1)
    http-request lua.find_route {{DIR}}/maps/fe

    http-request return status 200 content-type "text/plain" lf-string "route=%[var(txn.route)]"
