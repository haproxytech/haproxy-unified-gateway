global
    tune.lua.bool-sample-conversion normal
    stats socket {{ADMIN_SOCK}} mode 660 level admin
    lua-load-per-thread {{ROUTE_LUA}}

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend fe
    bind unix@{{HTTP_SOCK}}

    # Preload all three path maps so find_route can reach them via core.get_patref.
    acl _preload_exact  str(_),map({{DIR}}/maps/fe/path_exact.map)  -m found
    acl _preload_prefix str(_),map_beg({{DIR}}/maps/fe/path_prefix.map) -m found
    acl _preload_regex  str(_),map_reg({{DIR}}/maps/fe/path_regex.map) -m found

    http-request set-var(txn.path) path
    # fhdr (not hdr) preserves commas — matters for the multi-candidate test.
    http-request set-var(txn.selected_listener_route)          req.fhdr(X-LR-Exact)
    http-request set-var(txn.selected_listener_route_wildcard) req.fhdr(X-LR-Wild)

    http-request lua.find_route {{DIR}}/maps/fe

    http-request return status 200 content-type "text/plain" lf-string "route=%[var(txn.route)] blr=%[var(txn.base_listener_route)]"
