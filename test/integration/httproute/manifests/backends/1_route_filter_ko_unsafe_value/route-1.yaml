apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-echo-1
spec:
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - "example.haproxy"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /valid
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Literal
          value: "%[env(HOME)] is not evaluated"
    backendRefs:
    - name: http-echo-1
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /invalid
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - "x\nfrontend injected\n  bind 127.0.0.1:28999"
    backendRefs:
    - name: http-echo-1
      port: 80
