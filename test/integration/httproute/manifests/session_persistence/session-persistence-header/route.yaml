apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-echo
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - "example.haproxy"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sticky
      backendRefs:
        - name: http-echo
          port: 80
      sessionPersistence:
        type: Header
        header:
          name: "X-Session"
