apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: parity-route
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: parity-gateway
    sectionName: tls
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: parity-listenerset
    sectionName: tls
  hostnames:
  - "parity.haproxy"
  rules:
  - backendRefs:
    - name: http-echo
      port: 443
