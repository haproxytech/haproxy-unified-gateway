apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-via-listener-set-wrong-origin
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: listenerset-grant-wrong-origin
    sectionName: ls-wrong-origin-listener
  hostnames:
  - "ls-wrong-origin.haproxy"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: http-echo
      port: 80
