## A Gateway that accepts ListenerSets, and declares one listener of its own: the
## point of the case is that the contributed listener is served alongside it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hug-gateway
spec:
  gatewayClassName: haproxy
  listeners:
  - name: gateway-listener
    port: 31081
    protocol: HTTP
    hostname: "gateway.haproxy"
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
  allowedListeners:
    namespaces:
      from: All
