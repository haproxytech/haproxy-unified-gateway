## One ListenerSet contributing one listener, on the same port as the Gateway's own
## and a different hostname, so nothing conflicts: the two are merged into one
## frontend and told apart by hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: listenerset-contributing
spec:
  parentRef:
    name: hug-gateway
  listeners:
  - name: ls-listener
    port: 31081
    protocol: HTTP
    hostname: "ls.haproxy"
    allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
