## One HTTPS entry on the same port as the Gateway's own listener, with a
## certificate of its own: the two origins share the frontend, so they share its crt-list.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: listenerset-tls
spec:
  parentRef:
    name: hug-gateway
  listeners:
  - name: ls-tls-listener
    port: 31445
    protocol: HTTPS
    hostname: "ls-tls.haproxy"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: offload2
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
