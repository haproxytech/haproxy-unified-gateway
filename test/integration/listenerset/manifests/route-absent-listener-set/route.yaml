apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-two-parents
spec:
  parentRefs:
  - name: hug-gateway
    sectionName: gateway-listener
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: listenerset-absent
    sectionName: ls-listener
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /served
    backendRefs:
    - name: http-echo
      port: 80
