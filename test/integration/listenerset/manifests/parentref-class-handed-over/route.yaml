apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-after-the-listener-set
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: listenerset
    sectionName: ls-listener
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /served
    backendRefs:
    - name: http-echo
      port: 80
