## One HTTPRoute naming both listeners: the Gateway's own and the contributed entry. A
## single object feeding both sides is what makes the comparison about the two code paths
## rather than about two routes that happen to be written alike.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parity-route
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: parity-gateway
    sectionName: http
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: parity-listenerset
    sectionName: http
  hostnames:
  - "parity.haproxy"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /parity
    backendRefs:
    - name: http-echo
      port: 80
