## The Gateway's own side of the pair: its own route object. The two routes are the same
## request -- same hostname, same path, same backend -- written twice, which is what the
## second half of the parity property covers.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parity-route-gateway
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: parity-gateway
    sectionName: https
  hostnames:
  - "parity.haproxy"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /parity
    backendRefs:
    - name: http-echo
      port: 80
