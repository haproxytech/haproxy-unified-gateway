apiVersion: gate.v3.haproxy.org/v3
kind: Defaults
metadata:
  name: defaults
spec:
  merge_strategy: override
  name: haproxytech
  acl_list:
    - acl_name: is_internal
      criterion: src
      value: 192.168.0.0/16
    - acl_name: is_health
      criterion: path
      value: /healthz
  http_error_rule_list:
    - status: 503
      type: status
    - status: 404
      type: status
