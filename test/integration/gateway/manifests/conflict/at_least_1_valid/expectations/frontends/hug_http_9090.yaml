acl_list:
- acl_name: route_is_json
  criterion: var(txn.route),bytes(0,1)
  metadata:
    hug: for lua routing
  value: -m str {
- acl_name: lr_exact_single
  criterion: var(txn.selected_listener_route)
  metadata:
    hug: single exact-host candidate
  value: -m reg ^[^,]+$
- acl_name: lr_wild_single
  criterion: var(txn.selected_listener_route_wildcard)
  metadata:
    hug: single wildcard-host candidate
  value: -m reg ^[^,]+$
- acl_name: lr_exact_found
  criterion: var(txn.selected_listener_route)
  metadata:
    hug: exact-host candidates present
  value: -m found
- acl_name: lr_wild_found
  criterion: var(txn.selected_listener_route_wildcard)
  metadata:
    hug: wildcard-host candidates present
  value: -m found
- acl_name: fast_path
  criterion: var(txn.lr)
  metadata:
    hug: native fast-path lookup active
  value: -m found
- acl_name: _preload_path_exact
  criterion: str(_),map(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/path_exact.map)
  metadata:
    hug: preload path_exact.map for lua.find_route
  value: -m found
- acl_name: _preload_path_prefix
  criterion: str(_),map_beg(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/path_prefix.map)
  metadata:
    hug: preload path_prefix.map for lua.find_route
  value: -m found
- acl_name: _preload_path_regex
  criterion: str(_),map_reg(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/path_regex.map)
  metadata:
    hug: preload path_regex.map for lua.find_route
  value: -m found
backend_switching_rule_list:
- cond: if
  cond_test: route_is_json
  name: '%[var(txn.backend)]'
- name: '%[var(txn.route)]'
binds:
  v4:
    address: 0.0.0.0
    name: v4
    port: 9090
  v6:
    address: '::'
    name: v6
    port: 9090
default_backend: backend_not_found
from: haproxytech
http_request_rule_list:
- type: set-var
  var_expr: path
  var_name: path
  var_scope: txn
- type: set-var
  var_expr: req.hdr(Host),host_only
  var_name: host
  var_scope: txn
- type: set-var
  var_expr: req.hdr(Host),host_only,lua.reverse_host
  var_name: hostreversed
  var_scope: txn
- type: set-var
  var_expr: var(txn.host),concat("",txn.path)
  var_name: base
  var_scope: txn
- metadata:
    hug: listener exact match selection
  type: set-var
  var_expr: var(txn.host),map(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/listener_exact_match.map)
  var_name: selected_listener_name
  var_scope: txn
- metadata:
    hug: listener wildcard match selection
  type: set-var
  var_expr: var(txn.hostreversed),map_beg(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/listener_wildcard_match.map)
  var_name: selected_listener_name,ifnotexists
  var_scope: txn
- type: set-var
  var_expr: var(txn.selected_listener_name),concat("/",txn.host)
  var_name: tmp_exact
  var_scope: txn
- metadata:
    hug: listener-route exact match selection
  type: set-var
  var_expr: var(txn.tmp_exact),map(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/listener_route_exact_match.map)
  var_name: selected_listener_route
  var_scope: txn
- type: set-var
  var_expr: var(txn.selected_listener_name),concat("/",txn.hostreversed)
  var_name: tmp_wild
  var_scope: txn
- metadata:
    hug: listener-route wildcard match selection
  type: set-var
  var_expr: var(txn.tmp_wild),map_beg(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/listener_route_wildcard_match.map)
  var_name: selected_listener_route_wildcard
  var_scope: txn
- cond: if
  cond_test: lr_exact_single !lr_wild_found
  metadata:
    hug: 'fast path: single exact-host candidate'
  type: set-var
  var_expr: var(txn.selected_listener_route)
  var_name: lr
  var_scope: txn
- cond: if
  cond_test: lr_wild_single !lr_exact_found
  metadata:
    hug: 'fast path: single wildcard-host candidate'
  type: set-var
  var_expr: var(txn.selected_listener_route_wildcard)
  var_name: lr
  var_scope: txn
- cond: if
  cond_test: fast_path
  metadata:
    hug: 'fast path: BLR computation'
  type: set-var
  var_expr: var(txn.lr),concat("",txn.path)
  var_name: blr
  var_scope: txn
- cond: if
  cond_test: fast_path
  metadata:
    hug: 'fast path: base listener route for logs'
  type: set-var
  var_expr: var(txn.blr)
  var_name: base_listener_route
  var_scope: txn
- cond: if
  cond_test: fast_path
  metadata:
    hug: 'fast path: exact path match'
  type: set-var
  var_expr: var(txn.blr),map(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/path_exact.map)
  var_name: route
  var_scope: txn
- cond: if
  cond_test: fast_path
  metadata:
    hug: 'fast path: longest prefix match'
  type: set-var
  var_expr: var(txn.blr),map_beg(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/path_prefix.map)
  var_name: route,ifnotexists
  var_scope: txn
- cond: if
  cond_test: fast_path
  metadata:
    hug: 'fast path: regex match'
  type: set-var
  var_expr: var(txn.blr),map_reg(/tmp/hug/e2e-tests-gateway/maps/hug_http_9090/path_regex.map)
  var_name: route,ifnotexists
  var_scope: txn
- cond: if
  cond_test: '!fast_path'
  lua_action: find_route
  lua_params: /tmp/hug/e2e-tests-gateway/maps/hug_http_9090
  metadata:
    hug: 'lua find_route: multi-candidate scoring + path map lookup'
  type: lua
- cond: if
  cond_test: route_is_json
  lua_action: route
  metadata:
    hug: lua routing
  type: lua
metadata:
  hug:
    Gateway:
      e2e-tests-gateway/gateway2:
        Generation: 1
        LinkID: hug
mode: http
name: hug_http_9090
