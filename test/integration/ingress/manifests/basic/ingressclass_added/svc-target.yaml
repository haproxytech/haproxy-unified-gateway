kind: Deployment
apiVersion: apps/v1
metadata:
  name: http-echo-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-echo-target
  template:
    metadata:
      labels:
        app: http-echo-target
    spec:
      containers:
        - name: http-echo
          image: "haproxytech/http-echo:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: http-echo-target
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  selector:
    app: http-echo-target
