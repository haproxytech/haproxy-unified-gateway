apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-hug
spec:
  ingressClassName: hug
  rules:
    - host: hug.ingress
      http:
        paths:
          - path: /path1
            pathType: Prefix
            backend:
              service:
                name: http-echo
                port:
                  number: 80
