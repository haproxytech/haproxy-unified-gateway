#https://taskfile.dev/
version: "3"

env:
  KUBECTL_VERSION: v1.35.0
  K8S_VERSION: v1.35.0
  GWAPI_VERSIONS: v1.3.0, v1.4.0, v1.5.0
  GWAPI_EXP_VERSIONS:
  ENVTEST_VERSION: v1.35.0 # https://raw.githubusercontent.com/kubernetes-sigs/controller-tools/master/envtest-releases.yaml
  CLUSTER_NAME: '{{ default "dev-controller" .CLUSTER_NAME}}'
  DOCKER_FILE: '{{ default "-build/Dockerfile" .DOCKER_FILE}}'
  TMP: tmp

vars:
  CONFIG_DIR: "example/deploy"
  DEV_INIT_DIR: "example/dev-init"
  API_DEFINITION_DIR: "api/definition"
  # tools
  YQ: github.com/mikefarah/yq/v4@v4.47.1
  KIND: sigs.k8s.io/kind@v0.31.0
  CLOUD_PROVIDER_KIND: sigs.k8s.io/cloud-provider-kind@v0.10.0
  CONTROLLER_GEN: sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1
  CHECK_COMMIT: github.com/haproxytech/check-commit/v5@v5.5.3
  BETTERALIGN: github.com/dkorunic/betteralign/cmd/betteralign@v0.9.0
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.7.0
  GO_LICENSES: github.com/google/go-licenses@v1.6.0
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.1.4
  GOFUMPT: mvdan.cc/gofumpt@v0.9.2
  REVIVE: github.com/mgechev/revive@v1.15.0
  GOTESTSUM: gotest.tools/gotestsum@v1.13.0

dotenv:
  - .env

includes:
  k0s:
    taskfile: taskfile/k0s.yml
    flatten: true
  kind:
    taskfile: taskfile/kind.yml
    flatten: true
  kubectl:
    taskfile: taskfile/kubectl.yml
    flatten: true
  git:
    taskfile: taskfile/git.yml
    flatten: true
  generate:
    taskfile: taskfile/generate.yml
    flatten: true
  go-tools:
    taskfile: taskfile/go-tools.yml
    flatten: true
  controller-gen:
    taskfile: taskfile/controller-gen.yml
    flatten: true
  conformance:
    taskfile: taskfile/conformance.yml
    flatten: true

tasks:
  ci:
    desc: "do almost all the checks"
    cmds:
      - task: check-commit
      - task: tidy
      - task: format
      - task: generate
      - task: controller-gen
      - task: lint
      - task: test

  test:
    desc: "run Go tests"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOTESTSUM
    vars:
      TOOL: envtest
      PKG: '{{default "./..." .PKG}}'
      FORMAT: '{{default "testdox" .FORMAT}}'
      SEQUENTIAL: '{{default "false" .SEQUENTIAL}}'
      POD_IP: "1.2.3.4"
      POD_NAME: "hug-7469984948-qgnfw"
      POD_NAMESPACE: "hug"
      HAPROXY_BIN: '{{or (env "HAPROXY_BIN") "/usr/local/sbin/haproxy"}}'
    cmds:
      - |
        KUBEBUILDER_ASSETS=/{{.TMP}}/{{.TOOL}} \
        ENVTEST_VERSION={{.ENVTEST_VERSION}} \
        POD_IP={{.POD_IP}} \
        POD_NAME={{.POD_NAME}} \
        POD_NAMESPACE={{.POD_NAMESPACE}} \
        HAPROXY_BIN={{.HAPROXY_BIN}} \
        POD_IP=$POD_IP POD_NAME=$POD_NAME POD_NAMESPACE=$POD_NAMESPACE ENVTEST_VERSION=$ENVTEST_VERSION KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS HAPROXY_BIN=$HAPROXY_BIN \
        $(check-go-tool {{.GOTESTSUM}}) \
          --format-icons=hivis \
          --format={{.FORMAT}} \
          --format-hide-empty-pkg \
          -- -count=1 \
            {{if eq .SEQUENTIAL "true"}}-p 1{{end}}\
            -tags="{{.TEST_TAGS}}" \
            -failfast \
            -v \
            {{.PKG}}
  tidy:
    desc: "run Go mod tidy"
    cmds:
      - go mod tidy

  lint:
    desc: "run Go linters"
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [BETTERALIGN, REVIVE, STATICCHECK]
    cmds:
      - "$(check-go-tool {{.REVIVE}}) -config revive.toml -formatter friendly -set_exit_status ./..."
      - "$(check-go-tool {{.STATICCHECK}}) ./..."
      - "$(check-go-tool {{.BETTERALIGN}}) ./..."

  format:
    desc: "formats the code"
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [BETTERALIGN, GOFUMPT]
    cmds:
      - go fix ./...
      - "$(check-go-tool {{.BETTERALIGN}}) -apply ./... || true"
      - "$(check-go-tool {{.GOFUMPT}}) -l -w ."
      - go run cmd/crd-version-check/main.go

  licenses:
    dir: cmd/controller
    desc: "check licenses"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GO_LICENSES
    cmds:
      - |
        PROJECT="$(go list -m)"
        ALLOWED_LICENSES="$(<../../.allowed_license_types)"
        BIN="$(check-go-tool {{.GO_LICENSES}})"
        $BIN report --ignore "$PROJECT" --ignore "github.com/modern-go/reflect2" --ignore "golang.org/x/sys" --ignore "golang.org/x/sys/unix"  .
        $BIN check --allowed_licenses="$ALLOWED_LICENSES" --ignore "$PROJECT"  --ignore "github.com/modern-go/reflect2" --ignore "github.com/modern-go/reflect2" --ignore "golang.org/x/sys/unix"  .

  check-commit:
    deps:
      - task: check-go-tool
        vars:
          TOOL: CHECK_COMMIT
    cmds:
      - "$(check-go-tool {{.CHECK_COMMIT}})"

  govulncheck:
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOVULNCHECK
    cmds:
      - "$(check-go-tool {{.GOVULNCHECK}}) -show verbose ./..."

  legal:
    desc: "check legal"
    cmds:
      - task: govulncheck
      - task: licenses

  controller-gen:
    cmds:
      - task: controller-gen-deep-copy
      - task: controller-gen-manifest
